version: 2
updates:
  # GitHub Actions used by the CI + docs workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"

  # .NET dependencies (TagLibSharp, YamlDotNet, the analyzers) across the solution.
  - package-ecosystem: nuget
    directory: "/dotnet"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    groups:
      dotnet:
        patterns:
          - "*"

  # Python tooling for the docs site + data validation (requirements-docs.txt).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
