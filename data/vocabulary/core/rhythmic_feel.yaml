# SDTS baseline vocabulary — hand-maintained normative value set (edit directly).
# Bindings live in data/fields.yaml. Regenerate derived artifacts after editing:
#   python scripts/gen_vocab_docs.py
#
dimension: rhythmic_feel
layer: core
axes:
- name: pulse
  values:
  - 2
  - 3
  - 4
  - mixed
  description: How many felt beats per bar.
- name: subdivision
  values:
  - straight
  - triplet
  - bass-feel
  - mixed
  description: Whether the 8ths are straight or swung; 'bass-feel' = the subdivision is set by the walking-bass
    pattern.
- name: accent
  values:
  - on-beat
  - off-beat
  - backbeat
  - clave
  - none
  description: Where the main accents fall.
- name: tier
  values:
  - 1
  - 2
  - 3
  description: Rank of a feel inside its cluster, 1 = the general feel. Absent on a feel with no general parent
    in its cluster; such a feel is ranked per dance scene in feel_scenes.yaml.
- name: cluster
  values:
  - swing
  - bass-line
  - shuffle
  - compound-triplet
  - straight
  - waltz
  - latin
  - brazilian
  - march
  - tango
  grouping: true
  labels:
    swing: "Swing"
    bass-line: "Bass line"
    shuffle: "Shuffle"
    compound-triplet: "Compound triplet"
    straight: "Straight"
    waltz: "Waltz"
    latin: "Latin"
    brazilian: "Brazilian"
    march: "March"
    tango: "Tango"
  description: The family of related feels a feel belongs to.
values:
- id: jazz-swing-8ths
  canonical: Jazz Swing 8ths
  cluster: swing
  aliases:
  - Swing 8ths
  - Swing
  - Jazz Swing
  - Swung 8ths
  - Swinging
  dsl_key: JazzSwing8ths
  pulse: 4
  subdivision: triplet
  accent: off-beat
  tier: 1
  bpm_range:
  - 80
  - 300
  description: 'The 8th notes are swung in a triplet feel (first 8th ~2/3, second ~1/3 of a triplet),
    giving a light bouncing pulse over 4 beats per bar; it is the foundational feel of the swing era.
    Distinguishing trait: lighter and less accented than Shuffle (jazz context vs. blues), and unlike
    Straight 4 the 8ths are uneven.'
  display:
    code: SW8
    emoji: 🎷
    icon: mdi:saxophone
    color: '#00838F'
  audio:
    clip: rhythmic_feel/jazz-swing-8ths.mp3
    youtube: https://www.youtube.com/watch?v=FS0JOTmiieo
    youtube_label: Benny Goodman — Sing, Sing, Sing
- id: walking-4
  canonical: Walking 4
  cluster: bass-line
  aliases:
  - Walking
  - Walking Bass
  - Four-on-the-floor (jazz)
  dsl_key: Walking4
  pulse: 4
  subdivision: bass-feel
  accent: on-beat
  tier: 1
  bpm_range:
  - 120
  - 280
  description: 'A 4-beat bass feel where the bass line plays a melodic note on every beat (four quarter
    notes per bar), often with chromatic walk-ups, rather than skipping beats. Distinguishing trait: vs
    Cut Time, the bass walks all four beats instead of hitting only 1 and 3; it is orthogonal to swing
    subdivision and usually layered with Jazz Swing 8ths.'
  display:
    code: WLK
    emoji: 🚶
    icon: mdi:walking
    color: '#00838F'
  audio:
    clip: rhythmic_feel/walking-4.mp3
    youtube: https://www.youtube.com/watch?v=g3JyQnYPkZk
    youtube_label: Count Basie — One O'Clock Jump
- id: shuffle
  canonical: Shuffle
  cluster: shuffle
  aliases:
  - Bouncy Shuffle
  dsl_key: Shuffle
  pulse: 4
  subdivision: triplet
  accent: backbeat
  tier: 1
  bpm_range:
  - 70
  - 170
  description: 'Triplet 8ths with the accent on the second 8th of each pair (the ''and''), producing a
    heavy, bouncy, dragging-and-jumping groove that is the backbone of jump and Chicago blues. Distinguishing
    trait: heavier and more accented than Jazz Swing 8ths, and triplet rather than the straight 8-to-the-bar
    of Boogie Shuffle.'
  display:
    code: SHF
    emoji: 🔀
    icon: material-symbols:shuffle
    color: '#00838F'
  audio:
    clip: rhythmic_feel/shuffle.mp3
    youtube: https://www.youtube.com/watch?v=P1EG__jgefA
    youtube_label: Louis Jordan & His Tympany Five — Choo Choo Ch'Boogie
