  - 200
  description: 'The piano left hand (or bass) drives eight even straight 8th notes per bar (''8 to the
    bar'') as a rolling motor, the signature of boogie-woogie. Distinguishing trait: despite its name
    it is straight, not triplet like Shuffle, and uses eight notes per bar rather than the four of Walking
