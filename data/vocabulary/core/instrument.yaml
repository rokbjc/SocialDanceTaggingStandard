# SDTS baseline vocabulary — hand-maintained normative value set (edit directly).
# Bindings live in data/fields.yaml. Regenerate derived artifacts after editing:
#   python scripts/gen_vocab_docs.py
#
dimension: instrument
layer: core
axes:
- name: tier
  values:
  - specific
  - generic
  description: Specific = one concrete instrument; Generic = a family (Reed, Brass, …).
values:
- id: piano
  canonical: Piano
  aliases:
  - Piano Led
  tier: specific
  parent: null
  typical_examples:
  - Count Basie
  - Fats Waller
  - Jerry Lee Lewis
  - Oscar Peterson
  description: 'Piano carries the melody and harmonic drive of the track, from stride and boogie left-hand
    pumps to single-note bop lines. Distinguishing trait: a polyphonic keyboard lead that holds rhythm
    and chords at once, unlike the single-line reed or brass leads. Count Basie and Fats Waller are the
    swing-era touchstones.'
  display:
    code: p
    emoji: 🎹
    icon: mdi:piano
    color: '#6D4C41'
- id: clarinet
  canonical: Clarinet
  aliases:
  - Clarinet Led
  tier: specific
  parent: reed
  typical_examples:
  - Benny Goodman
  - Artie Shaw
  - Pete Fountain
  description: 'Clarinet leads with a fluid, woody upper-register voice that soars over the band, the
    signature solo instrument of the swing era. Distinguishing trait: brighter and more agile than the
    saxophone, its reed sibling, with a liquid legato Goodman and Shaw made famous on uptempo swing.'
  display:
    code: cl
    emoji: 🎶
    icon: game-icons:clarinet
    color: '#6D4C41'
- id: saxophone
  canonical: Saxophone
  aliases:
  - Saxophone Led
  - Sax Led
  tier: specific
  parent: reed
  typical_examples:
  - Coleman Hawkins
  - Charlie Parker
  - Lester Young
  - Stan Getz
  description: 'Saxophone leads with a warm, breathy reed tone, from Hawkins'' big tenor to Parker''s
    fast alto lines. Distinguishing trait: rounder and heavier than the clarinet, its reed sibling, and
    the backbone of any sax-section feature. Lester Young and Stan Getz mark the lighter, cooler end.'
  display:
    code: sax
    emoji: 🎷
    icon: mdi:saxophone
    color: '#6D4C41'
- id: trumpet
  canonical: Trumpet
  aliases:
  - Trumpet Led
  - Cornet
  - Cornet Led
  tier: specific
  parent: brass
  typical_examples:
  - Louis Armstrong
  - Harry James
  - Dizzy Gillespie
  - Miles Davis
  description: 'Trumpet (or cornet) leads with a bright, piercing brass voice that cuts through the band,
    equally at home on hot-jazz breaks and bop. Distinguishing trait: higher and more brilliant than the
    trombone, its brass sibling. Louis Armstrong is the foundational example; Dizzy Gillespie and Miles
    Davis carry it into bop and beyond.'
  display:
    code: tp
    emoji: 🎺
    icon: mdi:trumpet
    color: '#6D4C41'
- id: trombone
  canonical: Trombone
  aliases:
  - Trombone Led
  tier: specific
  parent: brass
  typical_examples:
  - Jack Teagarden
  - Tommy Dorsey
  - J.J. Johnson
  description: 'Trombone leads with a smooth, sliding brass voice in the lower-middle register, capable
    of growls, glissandos, and singing ballads. Distinguishing trait: warmer and deeper than the trumpet,
    its brass sibling. Jack Teagarden and Tommy Dorsey define the swing-era lead.'
  display:
    code: tb
    emoji: 📯
    icon: game-icons:trombone
    color: '#6D4C41'
- id: guitar
  canonical: Guitar
  aliases:
  - Guitar Led
  tier: specific
  parent: string
  typical_examples:
  - Charlie Christian
  - T-Bone Walker
  - Chuck Berry
  - Django Reinhardt
  description: 'Guitar takes the lead line, from acoustic Gypsy-swing runs to amplified single-string
    solos. Distinguishing trait: a plucked string lead with sharper attack than the bowed violin, its
    string sibling. Charlie Christian pioneered the electric jazz solo; Django Reinhardt defines the acoustic
    Manouche lead.'
  display:
    code: g
    emoji: 🎸
    icon: ph:guitar
    color: '#6D4C41'
- id: violin
  canonical: Violin
  aliases:
  - Violin Led
  - Fiddle
  - Fiddle Led
  tier: specific
  parent: string
  typical_examples:
  - Stéphane Grappelli
  - Joe Venuti
  - Bob Wills (fiddle)
  description: 'Violin (or fiddle) leads with a singing, bowed string voice, swinging in Gypsy jazz and
    sawing in Western Swing. Distinguishing trait: a sustained, bowed lead with continuous tone, unlike
    the plucked attack of the guitar or banjo. Stéphane Grappelli is the jazz touchstone; Bob Wills the
    Western-Swing one.'
  display:
    code: vln
    emoji: 🎻
    icon: mdi:violin
    color: '#6D4C41'
- id: banjo
  canonical: Banjo
  aliases:
  - Banjo Led
  tier: specific
  parent: string
  typical_examples:
  - Johnny St. Cyr (Hot Five)
  - Eddie Condon
  - Harry Reser
  - Earl Scruggs
  description: 'Banjo leads with a bright, percussive, fast-decaying string tone central to early hot
    jazz and trad bands. Distinguishing trait: sharper and more clipped than the sustaining guitar, its
    string sibling, giving an older-sounding chank. Johnny St. Cyr of the Hot Five and Eddie Condon are
    the classic examples.'
  display:
    code: bjo
    emoji: 🪕
    icon: game-icons:banjo
    color: '#6D4C41'
- id: harmonica
  canonical: Harmonica
  aliases:
  - Harmonica Led
  - Harp
  - Harp Led
  tier: specific
  parent: novelty
  typical_examples:
  - Little Walter
  - Sonny Boy Williamson
  - Junior Wells
  description: 'Harmonica (harp) leads with a reedy, vocal, bent-note voice, most at home in blues. Distinguishing
    trait: a free-reed lead with expressive pitch-bending unlike any of the brass or string instruments.
    Little Walter and Sonny Boy Williamson are the amplified-blues benchmarks.'
  display:
    code: hrm
    emoji: 🎼
    icon: qlementine-icons:harmonica-16
    color: '#6D4C41'
- id: organ
  canonical: Organ
  aliases:
  - Organ Led
  - Hammond
  - Hammond Led
  - Hammond B-3
  tier: specific
  parent: novelty
  typical_examples:
  - Jimmy Smith
  - Jack McDuff
  - Brother Jack McDuff
  description: 'Organ leads with the sustained, drawbar-rich voice of the Hammond B-3, often grooving
    over its own bass pedals in soul-jazz and jump blues. Distinguishing trait: a held, swelling keyboard
    tone with no decay, unlike the percussive attack of the piano. Jimmy Smith and Jack McDuff are the
    touchstones.'
  display:
    code: org
    emoji: 🎵
    icon: game-icons:pipe-organ
    color: '#6D4C41'
- id: vibraphone
  canonical: Vibraphone
  aliases:
  - Vibraphone Led
  - Vibes
  - Vibes Led
  - Vibes-led
  tier: specific
  parent: novelty
  typical_examples:
  - Lionel Hampton
  - Milt Jackson
  - Gary Burton
  description: 'Vibraphone (vibes) leads with a shimmering, metallic, mallet-struck tone, often with a
    slow tremolo. Distinguishing trait: a tuned-percussion lead with a bell-like sustain unlike the brass,
    reed, or string voices. Lionel Hampton brought it into swing; Milt Jackson into bop.'
  display:
    code: vib
    emoji: 🔔
    icon: game-icons:xylophone
    color: '#6D4C41'
- id: accordion
  canonical: Accordion
  aliases:
  - Accordion Led
  tier: specific
  parent: novelty
  typical_examples:
  - Clifton Chenier
  - Richard Galliano
  - Astor Piazzolla
  description: 'Accordion leads with a reedy, bellows-driven voice that can sustain and swell, prominent
    in zydeco, musette, and tango. Distinguishing trait: a free-reed lead capable of chords and held tones
    unlike the single-line harmonica. Clifton Chenier (zydeco) and Astor Piazzolla (tango) mark the range.'
  display:
    code: acc
    emoji: 🪗
    icon: game-icons:accordion
    color: '#6D4C41'
- id: drums
  canonical: Drums
  aliases:
  - Drums Led
  tier: specific
  parent: rhythm
  typical_examples:
  - Gene Krupa
  - Buddy Rich
  - Art Blakey
  description: 'Drums take the lead through extended kit features, solos, and tom-tom hooks rather than
    just keeping time. Distinguishing trait: an unpitched percussion lead, the rhythmic counterpart to
    the pitched bass within the rhythm family. Gene Krupa and Buddy Rich are the swing-era showcases.'
  display:
    code: dr
    emoji: 🥁
    icon: nimbus:drums
    color: '#6D4C41'
- id: bass
  canonical: Bass
  aliases:
  - Bass Led
  - Bass Guitar
  - Double Bass
  tier: specific
  parent: rhythm
  typical_examples:
  - Jimmy Blanton
  - Paul Chambers
  - Charles Mingus
  - Jaco Pastorius
  description: 'Bass takes the lead through walking features, solos, and prominent bass lines, on double
    bass or bass guitar. Distinguishing trait: the pitched low-end lead of the rhythm family, paired with
    the unpitched drums. Jimmy Blanton pioneered the solo role; Paul Chambers and Mingus carried it into
    bop.'
  display:
    code: b
    emoji: 🎸
    icon: game-icons:guitar-bass-head
    color: '#6D4C41'
- id: reed
  canonical: Reed
  aliases:
  - Reed Led
  - Reeds
  - Reeds Led
  tier: generic
  typical_examples:
  - Big band sax section
  - Miller 'In the Mood' sax chase
  description: 'Generic family covering clarinet- and saxophone-led tracks, including reed-section features.
    Distinguishing trait: use when the lead is clearly a reed voice or a sax/clarinet section, but the
    specific instrument is unknown or shifts across the track. A Miller-style sax chase or big-band sax
    section is the typical case.'
  display:
    code: Rd
    emoji: 🎷
    icon: mdi:saxophone
    color: '#6D4C41'
- id: brass
  canonical: Brass
  aliases:
  - Brass Led
  - Horns
  - Horns Led
  tier: generic
  typical_examples:
  - Ellington brass features
  - big band brass shouts
  description: 'Generic family covering trumpet- and trombone-led tracks, including brass-section shouts
    and features. Distinguishing trait: use when the lead is clearly brass or a horn section, but the
    specific instrument is unknown or alternates. Ellington brass features and big-band brass shouts are
    the typical case.'
  display:
    code: Br
    emoji: 🎺
    icon: mdi:trumpet
    color: '#6D4C41'
- id: string
  canonical: String
  aliases:
  - String Led
  - Strings
  - Strings Led
  tier: generic
  typical_examples:
  - Manouche ensemble (Django + Grappelli)
  - Western Swing fiddle+steel
  description: 'Generic family covering guitar-, violin-, and banjo-led tracks. Distinguishing trait:
    use when the lead is a plucked or bowed string ensemble, or alternates among strings, rather than
    one identifiable instrument. A Manouche ensemble (Django plus Grappelli) or a Western-Swing fiddle-and-steel
    front line is the typical case.'
  display:
    code: Str
    emoji: 🎻
    icon: ph:guitar
    color: '#6D4C41'
- id: vocal
  canonical: Vocal
  aliases:
  - Vocal Led
  - Vocals Led
  - Voice Led
  tier: generic
  typical_examples:
  - Ella
  - Sinatra
  - Bessie
  - Mahalia
  description: 'Generic family for vocal-led tracks where the voice is the lead instrument. Distinguishing
    trait: covers no specific sub-instruments; use whenever a singer fronts the track, across jazz, blues,
    and gospel. Ella, Sinatra, Bessie Smith, and Mahalia Jackson span the range.'
  display:
    code: Voc
    emoji: 🎤
    icon: mdi:microphone
    color: '#6D4C41'
- id: rhythm
  canonical: Rhythm
  aliases:
  - Rhythm Led
  - Rhythm Section
  tier: generic
  typical_examples:
  - Gene Krupa drum features
  - walking bass focus
  - Krupa-led tom-tom hooks
  description: 'Generic family covering drums- and bass-led tracks where the rhythm section is the feature.
    Distinguishing trait: use when the lead is the rhythm section as a whole, or shifts between drums
    and bass, rather than a melodic instrument. Gene Krupa drum features and walking-bass focus are the
    typical cases.'
  display:
    code: Rhy
    emoji: 🥁
    icon: mdi:metronome
    color: '#6D4C41'
- id: novelty
  canonical: Novelty
  aliases:
  - Novelty Led
  tier: generic
  typical_examples:
  - Clifton Chenier (accordion)
  - Clarence Cameron White (banjo)
  - vibes-features
  description: 'Generic catch-all family for less-common lead instruments: harmonica, organ, vibraphone,
    accordion, and banjo. Distinguishing trait: use when the lead falls outside the main reed, brass,
    string, and rhythm families. Clifton Chenier on accordion or a vibes feature is the typical case.'
  display:
    code: Nov
    emoji: ✨
    icon: tabler:sparkle
    color: '#6D4C41'
# --- credit-only instruments (lead_capable: false) ------------------------------------------------
# These appear in TMCL (Musician Credits List) — "who played what" — but rarely carry a track as the
# lead voice, so they are excluded from the instrument_led lead subset (lead_capable: false). Everything
# above is lead_capable by default (absent flag ⇒ lead-capable). This is the unified instrument
# vocabulary: the lead field reads the lead_capable subset, credit resolution reads the whole set.
- id: tuba
  canonical: Tuba
  aliases:
  - Sousaphone
  - Bass Horn
  tier: specific
  parent: brass
  lead_capable: false
  typical_examples:
  - Howard Johnson
  - New Orleans brass bands
  description: 'Tuba (or sousaphone) supplies the walking bass line in a brass band or early-jazz rhythm
    section. Distinguishing trait: the lowest brass voice, a section/credit instrument that rarely takes
    the lead.'
  display:
    code: tba
    emoji: 🎺
    icon: game-icons:tuba
    color: '#6D4C41'
- id: cello
  canonical: Cello
  aliases:
  - Violoncello
  tier: specific
  parent: string
  lead_capable: false
  typical_examples:
  - Oscar Pettiford (cello)
  - Ron Carter (piccolo cello)
  description: 'Cello adds a warm low-string voice, occasionally bowed or plucked as a solo colour but
    usually a section/credit instrument. Distinguishing trait: lower and darker than the violin, its
    string sibling.'
  display:
    code: vc
    emoji: 🎻
    icon: game-icons:cello
    color: '#6D4C41'
- id: flute
  canonical: Flute
  aliases:
  - Flutes
  tier: specific
  parent: novelty
  lead_capable: false
  typical_examples:
  - Frank Wess
  - Herbie Mann
  description: 'Flute contributes a light, airy woodwind colour, most often a section or credit voice in
    swing and blues rather than the lead. Distinguishing trait: a breathy, high woodwind unlike the reed
    or brass leads.'
  display:
    code: fl
    emoji: 🎶
    icon: game-icons:flute
    color: '#6D4C41'
- id: washboard
  canonical: Washboard
  aliases:
  - Frottoir
  tier: specific
  parent: rhythm
  lead_capable: false
  typical_examples:
  - Washboard Sam
  - jug-band rhythm sections
  description: 'Washboard provides scraped hand-percussion in jug bands and early hot jazz. Distinguishing
    trait: an unpitched credit/rhythm instrument, the folk cousin of the drum kit.'
  display:
    code: wb
    emoji: 🥁
    icon: game-icons:washboard
    color: '#6D4C41'
- id: percussion
  canonical: Percussion
  aliases:
  - Percussions
  tier: specific
  parent: rhythm
  lead_capable: false
  typical_examples:
  - Latin percussion sections
  - congas, bongos, timbales
  description: 'Percussion covers hand and auxiliary percussion (congas, bongos, timbales, shakers) beyond
    the drum kit. Distinguishing trait: an unpitched credit/rhythm voice added for texture, not a lead.'
  display:
    code: perc
    emoji: 🥁
    icon: game-icons:congas
    color: '#6D4C41'
