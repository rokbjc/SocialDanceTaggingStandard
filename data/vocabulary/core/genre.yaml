# SDTS baseline vocabulary — hand-maintained normative value set (edit directly).
# Bindings live in data/fields.yaml. Regenerate derived artifacts after editing:
#   python scripts/gen_vocab_docs.py
#
dimension: genre
layer: core
# AI-drafted from mainstream musicology; a music expert has not confirmed them yet.
validation:
  typical_rhythmic_feels: expert-review-pending
  typical_song_forms: expert-review-pending
axes:
- name: family
  values:
  - jazz
  - blues
  - swing
  - country
  - rnb
  - soul
  - rock
  - pop
  - latin
  - world
  - electro
  - gospel
  - ragtime
  - novelty
  - folk
  - regional
  - classical
  - dance
  - electronic
  - misc
  - r-and-b
  - urban
  grouping: true
  labels:
    jazz: "Jazz"
    blues: "Blues"
    swing: "Swing & big band"
    country: "Country"
    rnb: "Rhythm & blues"
    soul: "Soul"
    rock: "Rock"
    pop: "Pop"
    latin: "Latin"
    world: "World"
    electro: "Electro"
    gospel: "Gospel"
    ragtime: "Ragtime"
    novelty: "Novelty"
    folk: "Folk"
    regional: "Regional"
    classical: "Classical"
    dance: "Dance"
    electronic: "Electronic"
    misc: "Miscellaneous"
    r-and-b: "Funk & groove"
    urban: "Urban"
  description: The musical family a genre belongs to (a flat grouping; the genre hierarchy is `parent`).
- name: era_start
  description: When the genre first appeared (year).
- name: era_end
  description: End of activity (year; null = ongoing).
- name: dance_relevance
  values:
  - high
  - medium
  - low
  - none
  description: Relevance to social-dance floors across scenes (swing, blues, tango, ballroom, street latin).
