  description: 'A slotted partner dance from the 1940s Carolina coast, descended from the Carolina
    Jitterbug and the Little Apple and built on a six-count, eight-step basic (triple, triple, rock),
    danced to Carolina beach music; the official state dance of South Carolina (1984) and the official
    popular dance of North Carolina (2005). Distinguishing trait: a slotted triple-triple-rock basic to
    beach music (vs. the swing-era Collegiate Shag and St. Louis Shag, which it resembles only in
    name).'
  disambiguation: Carolina beach-music shag. NOT Collegiate Shag (swing/collegiate-shag) or St. Louis
    Shag (swing/st-louis-shag).
