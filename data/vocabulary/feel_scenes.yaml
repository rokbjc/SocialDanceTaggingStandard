# HAND-MAINTAINED — scene-relative feel ranking, from the dance->genre->feel walk (not swing-biased).
# Replaces the single global rhythmic_feel `tier`: each feel lists the scene(s) whose dances use it and
# its tier WITHIN that scene (1 = anchor/core … 3 = niche). A feel with no scenes is unanchored (a
# cross-genre/listening flavor with no social dance). `anchors` = the dances the feel is core to.
# Consumed by scripts/gen_vocab_docs.py to group the rhythmic-feel page by scene. Keys: feels: {<id>: …}.
#
feels:
  jazz-swing-8ths:
    scenes:
      swing: 1
      blues: 2
      ballroom: 2
    anchors:
