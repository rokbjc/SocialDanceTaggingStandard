# Social-Dance Tagging Standard (SDTS) - field registry
# Canonical, machine-readable. Curated from SDTS research.
# Authority: the SDTS baseline vocabulary (data/vocabulary/) owns taxonomy VALUES; this registry owns field SCHEMA + binding.
# status: active = used today (frozen on-disk frame) | proposed = new SDTS field | frozen-legacy
# Binding triangle: ID3 TXXX:NAME = Vorbis NAME = MP4 ----:com.apple.iTunes:NAME
# other_tools: how the field compares across other taggers/players (see docs/sync/tool-comparison.md)
version: 0.1.0-draft
fields:
  - id: "dance"
    display_name: "Dance"
    group: "taxonomy-core-a"
    layer: "taxonomy"
    status: "active"
    data_type: "enum"
    cardinality: "multi"
    value_source: "SDTS baseline vocabulary -> Dance Styles (canonical names + aliases)"
    allowed_values: "Multi-value list of canonical dance NAMES (plain canonical text, '; '-delimited), same model as genre: short forms, bare display codes and alternate spellings are ALIASES that resolve to the canonical name. Legacy '#'-prefixed codes are one DJ's shorthand and resolve only through a personal overlay (e.g. data/vocabulary/examples/legacy-hash-codes.sdvo.yaml), never through the baseline. ORDER IS SIGNIFICANT — the first entry is the primary/headline dance and the entry count is the track's dance-versatility, so there is no separate primary_dance or dance_versatility field. PER-NAME NOTATION: each name may carry an optional idiom-purity grade ':core'/':edge'/':fusion' on one generic scale (canonical -> boundary/crossover -> modern/contested; deviation direction lives in 'genre') plus an optional trailing '?' (= needs validation, pairs with confirmation_gates); consumers strip the ':grade' and trailing '?' to filter by dance, absent purity = unspecified/core. Display forms — a bare short code, an emoji, an Iconify icon and a suggested hex color — are SDTS-authored per-term metadata in each term's display block, not a standard tag mechanism; the legacy fitness suffix ('!'/'!!') and '!CC' AI marker are NOT part of the standard. Dances form a strict tree through the single-valued `parent` attribute: a group value (Swing, Ballroom Standard, Ballroom Latin, Street Latin, Argentine Tango Family; Blues for its idioms) names a set of dances, has no steps of its own and is taggable; normalisation keeps the most specific value when a track carries a group and one of its dances. A dance's tempo band is an advisory typical band for a social floor, never a hard limit (spec: Tempo bands). Value set: SDTS baseline vocabulary -> Dance Styles (not enumerated here)."
    id3_current: "COMM:Songs-DB_Occasion (lang XXX) — legacy MediaMonkey frame where existing files store dances today; now a Part-2 SYNC MIRROR, not the canonical home"
    id3_proposed: "TXXX:SDTS_DANCES (canonical/authoritative — there is NO standard ID3 frame for dances, so the SDTS_ tag IS the home, not a mirror; cf. genre/mood/bpm/rating, where the real standard frame stays canonical)"
    vorbis: "SDTS_DANCES"
    mm5_mirror: true
    mp4: "----:com.apple.iTunes:SDTS_DANCES"
    delimiter: "; "
    authority: "both"
    description: "Which social dances a track serves on the floor — the danceability axis, distinct from the musical 'genre' it belongs to and from the listening-situation 'theme'. A track may serve several dances at once, and order carries meaning: the first entry is the primary/headline dance and the entry count is the track's versatility, which is why there is no separate primary_dance or dance_versatility field. (The legacy MediaMonkey 'Occasion' column is a misnomer for this field, not a separate concept.)"
    rationale: "The single most load-bearing field for a social-dance DJ: it is how the library is filtered into per-dance pools and how 'pull me Lindy at 180' or 'blues set' queries resolve. Genre alone cannot answer danceability — the same Swing record may be Lindy-Hop-only or also Balboa depending on tempo and feel."
    type: "enum[]"
    dj_use: "Filter the library into per-dance pools and build for the room in front of you — 'give me Lindy at 180', 'a blues set'."
    other_tools: "No mainstream tool has a 'which dances this track serves' field; ballroom-DJ tools (BallroomDJ 4) use a 'Dance' field + alternate dances. SDTS: TXXX:SDTS_DANCES (multi) is the canonical home, with the frozen COMM:Songs-DB_Occasion kept as a Part-2 sync mirror (MediaMonkey compat) rather than the canonical store. The real listening-'occasion' / situation concept is the separate 'theme' field."
    examples:
      - "Lindy Hop"
      - "Lindy Hop; Balboa"
      - "Blues; Slow Drag"
      - "Blues:fusion"
      - "Lindy Hop:core?"
      - "East Coast Swing:edge"
  - id: "genre"
    display_name: "Genre"
    group: "taxonomy-core-a"
    layer: "taxonomy"
    status: "active"
    data_type: "enum"
    cardinality: "multi"
    value_source: "SDTS baseline vocabulary -> Music Genres (canonical names + aliases; per-value family/parent hierarchy + dance_relevance grade)"
    allowed_values: "Closed enum, multi-value ('; '-separated), stored as plain canonical text (never ID3v1 numeric codes). Non-canonical synonyms resolve to the canonical vocabulary name via the aliases frontmatter; do not stack a parent and its child in one field (hierarchy dedup -> keep the more specific). Each value carries vocabulary metadata (family/parent, era, dance_relevance grade, bpm_range) used to demote non-floor jazz. Value set: SDTS baseline vocabulary -> Music Genres (not enumerated here)."
    id3_current: "TCON"
    id3_proposed: "TCON — keep the standard frame; do NOT mint TXXX:SDTS_GENRE (routing rule 1: standard concept with a real ID3 frame uses the frame)."
    vorbis: "GENRE"
    mp4: "©gen (native MP4 genre atom) — do NOT mint a freeform ----:com.apple.iTunes:SDTS_GENRE mirror"
    delimiter: "; "
    authority: "both"
    description: "The musicological style(s) of the recording — the coarse musical bucket a DJ reasons about before tempo and feel. It captures what the music IS, not whether it is danceable: the same Swing record may suit Lindy, Balboa, or neither depending on the tempo and feel fields, so genre seeds dance and era expectations but never decides them alone."
    rationale: "Genre is the coarse musical bucket a DJ reasons about before tempo/feel — it drives era-appropriate programming (e.g. Herrang wants period swing, not Neo-Swing) and seeds occasion suggestions via each genre's typical_occasions. dance_relevance lets the toolkit demote contextual jazz (Free/Cool/Modal) that is not floor music."
    type: "enum[]"
    dj_use: "Reason about a track's era/character, seed dance + mood expectations, and build style-coherent or deliberately-contrasting blocks."
    other_tools: "Universal standard frame: TCON (ID3) / GENRE (Vorbis) / ©gen (MP4) — every tool. SDTS routes genre to TCON as its sole home; there is no SDTS_GENRE mirror (a bare TXXX would only shadow the standard frame). No single accepted genre vocabulary exists (Discogs ~15 genres + ~500 styles, MusicBrainz ~2,300, Spotify ~6,000); SDTS canonical names follow the Discogs Style / MusicBrainz genre spelling where one exists (Gypsy Jazz, Jump Blues, Chicago Blues, Boogie Woogie) so files round-trip, with other spellings carried as aliases."
    examples:
      - "Swing; Big Band"
      - "Chicago Blues"
      - "Gypsy Jazz"
      - "Jump Blues; Boogie Woogie"
      - "Vocal Jazz"
  - id: "mood"
    display_name: "Mood"
    group: "taxonomy-core-a"
    layer: "taxonomy"
    status: "active"
    data_type: "enum"
    cardinality: "multi"
    value_source: "SDTS baseline vocabulary -> Moods (canonical names on the Energy x Valence grid)"
    allowed_values: "Closed enum, multi-value; values joined with '; '. Stored as canonical text; each value carries an Energy axis and a Valence axis, each a 1-10 ordinal on the vocabulary's energy×valence mood model (the consumer discretises to a 3×3 / 5×5 grid). Multi-value captures tracks that shift or sit between cells. Value set: SDTS baseline vocabulary -> Moods (not enumerated here)."
    id3_current: "TMOO"
    id3_proposed: "TMOO — keep the standard frame; do NOT mint TXXX:SDTS_MOOD (routing rule 1: standard concept with a real ID3 frame uses the frame)."
    vorbis: "MOOD"
    mp4: "----:com.apple.iTunes:MOOD (standard MP4 mood convention) — do NOT mint a SDTS_MOOD mirror"
    delimiter: "; "
    authority: "both"
    description: "The track's emotional feel, placed on the vocabulary's Energy × Valence mood model. Unlike the standalone energy field (raw floor-drive) or theme (listening/event situation), mood is the valence-aware affect descriptor — what the record sounds like emotionally, not just how hard it pushes the room."
    rationale: "Mood is the affect lever for set-pacing and floor-reading — picking a 'cool down' or 'peak' record by feel, not just tempo. The handoff notes the mood grid couples energy to valence too coarsely for pure pacing, which is why a standalone SDTS_ENERGY field is proposed separately; mood remains the valence-aware descriptor."
    type: "enum[]"
    dj_use: "Steer the room's affect — pull a lift, a cool-down, or a peak by feel, and avoid jarring valence jumps."
    other_tools: "Strong de-facto: TMOO (ID3v2.4) — Picard, Mp3tag, Kid3, MusicBee, MediaMonkey, JRiver, beaTunes; foobar2000 uses TXXX:MOOD; WMA WM/Mood; Vorbis MOOD. SDTS keeps TMOO authoritative (a bare TXXX:MOOD would shadow it). The Energy×Valence grid is the valence–arousal plane of Russell's circumplex model of affect (1980) (Thayer's 1989 energy×stress model is the same plane relabeled), on a 1–10 energy×valence substrate that the consumer discretises (e.g. 3×3 or 5×5) — the dominant model in music-emotion research."
    examples:
      - "Joyful"
      - "Bluesy; Soulful"
      - "Melancholic"
      - "Hot; Wild"
      - "Tender"
  - id: "vocality"
    display_name: "Vocality"
    group: "taxonomy-core-a"
    layer: "taxonomy"
    status: "active"
    data_type: "enum"
    cardinality: "single"
    value_source: "SDTS baseline vocabulary -> Vocality (canonical names + aliases)"
    allowed_values: "Single canonical value per track (enum, cardinality single). Must resolve to a canonical Vocality name; one designated generic value serves as the fallback for mixed/uncertain tracks. Legacy free-text comment-tag forms (e.g. 'Vocal Male' / 'VM' / '(vm)') resolve to canonical values via aliases. Value set: SDTS baseline vocabulary -> Vocality (not enumerated here)."
    id3_current: "COMM:Songs-DB_Custom3 (lang XXX)"
    id3_proposed: "TXXX:SDTS_VOCALITY"
    vorbis: "SDTS_VOCALITY"
    mm5_mirror: true
    mp4: "----:com.apple.iTunes:SDTS_VOCALITY"
    delimiter: "—"
    authority: "both"
    description: "Captures whether anyone sings and in what role — instrumental versus a lead singer, an ensemble vocal, an occasional vocal feature over an otherwise instrumental track, or non-lyric voice like scat or spoken word — including the singer's gender where it applies. It describes the presence and character of the voice, not the words sung (lyric language is a separate field)."
    rationale: "DJs filter on vocality constantly: instrumentals for classes and jams, vocals for social sets, avoiding back-to-back same-singer. Promoting it from comment tags to a structured single-value field makes it queryable and validatable instead of buried in free text."
    type: "enum"
    dj_use: "Alternate instrumental vs vocal and male vs female leads for variety; pull instrumentals for classes/jams or vocals to draw the crowd."
    other_tools: "No mainstream tool has a single instrumental-vs-vocal + lead-type field. Closest is relational: MusicBrainz models it via the recording-work 'performance' relationship's 'instrumental' attribute and artist-recording 'vocal' performer relationships (reach files as performer:vocals); Discogs uses credit Roles ('Lead Vocals'); Apple treats 'Instrumental'/'Male Version' as title-version suffixes. MediaMonkey/MusicBee/JRiver/foobar2000 have no native field. SDTS folds instrumental/vocal + lead composition into one flat enum — SDTS-specific in shape, with clear relational prior art for the instrumental/vocal distinction."
    examples:
      - "Instrumental"
      - "Female"
      - "Male"
      - "Group"
      - "Feature"
  - id: "rhythmic_feel"
    display_name: "Rhythmic Feel"
    group: "taxonomy-core-a"
    layer: "taxonomy"
    status: "active"
    data_type: "enum"
    cardinality: "single"
    value_source: "SDTS baseline vocabulary -> Rhythmic Feels (canonical names + aliases)"
    allowed_values: "Single value (cardinality single) — one canonical Rhythmic Feel name (or alias resolving to one) from the controlled enum; resolve aliases to the canonical name before writing. Each value carries structured axes — pulse (2|3|4|mixed), subdivision (straight|triplet|bass-feel|mixed), accent (on-beat|off-beat|backbeat|clave|none). (`tier` ranks a feel inside its cluster, 1 = the general feel; it is absent for the 13 Latin, Brazilian, tango, march and waltz feels that have no general parent in their cluster, and those are ranked per dance scene through feel_scenes.yaml instead, so a single global rank never has to be swing-centric.) Beware name collisions: the 'Stride' feel vs the blues 'Stride' idiom, and the 'Slow Drag' feel vs the '#SD' Slow Drag occasion. Value set: SDTS baseline vocabulary -> Rhythmic Feels (not enumerated here)."
    id3_current: "COMM:Songs-DB_Custom4 (lang XXX)"
    id3_proposed: "TXXX:SDTS_RHYTHMIC_FEEL"
    vorbis: "SDTS_RHYTHMIC_FEEL"
    mm5_mirror: true
    mp4: "----:com.apple.iTunes:SDTS_RHYTHMIC_FEEL"
    delimiter: "—"
    authority: "both"
    description: "The dominant rhythmic groove a dancer locks into — the pre-tempo axis (swung vs straight vs shuffle vs slow-drag) that separates two records at the same BPM and genre into different dances and floor energies. It is finer-grained than meter: meter only gates the beats-per-bar grouping, while feel captures the subdivision and accent character within that grouping."
    rationale: "Feel is what separates two records at the same BPM and genre into different dances and different floor energy — swung 8ths vs straight boogie vs a 12/8 compound triplet route to different occasions and dancer comfort. It is the finest-grained pre-tempo programming axis a swing/blues DJ uses and underpins beat-grid-aware features."
    type: "enum"
    dj_use: "Hold or deliberately switch the groove (shuffle vs straight vs slow-drag) — the main blues flow lever beyond tempo."
    other_tools: "No 'groove/feel/rhythm' classification (swing-8ths vs shuffle vs stride) in any standard or library. The only 'rhythm' is AcousticBrainz/Essentia's high-level rhythm classifier + a 'danceable' flag — not a swing-feel taxonomy. SDTS-specific; the closest computed cousin (Essentia rhythm/danceability) does not capture the distinction."
    examples:
      - "Jazz Swing 8ths"
      - "Shuffle"
      - "Slow Drag"
      - "Stride"
      - "Manouche Swing"
  - id: "instrumentation"
    display_name: "Instrumentation (Ensemble)"
    group: "taxonomy-core-b"
    layer: "taxonomy"
    status: "active"
    data_type: "enum"
    cardinality: "single"
    value_source: "SDTS baseline vocabulary -> Instrumentation/Ensemble (canonical ensemble forms; carries a 'size' axis per value)"
    allowed_values: "Single-value enum: exactly one canonical ensemble form per track (no list, so the field-level delimiter does not apply). Value must resolve to a canonical name from the controlled vocabulary; each value carries a vocabulary-defined 'size' axis (solo through large) so DJs can filter by ensemble size independently of genre. Distinct from instrument_led (lead voice) and vocality (vocal presence/gender). Value set: SDTS baseline vocabulary -> Instrumentation/Ensemble (not enumerated here)."
    id3_current: "COMM:Songs-DB_Custom5 (lang XXX)"
    id3_proposed: "TXXX:SDTS_INSTRUMENTATION"
    vorbis: "SDTS_INSTRUMENTATION"
    mm5_mirror: true
    mp4: "----:com.apple.iTunes:SDTS_INSTRUMENTATION"
    delimiter: "—"
    authority: "both"
    description: "The performing-ensemble format of the recording — its size tier (solo through large) and idiom. Distinct from instrument_led (which lead voice carries the track) and vocality (presence and gender of vocals): instrumentation is about the shape and weight of the whole group, not who fronts it or whether anyone sings."
    rationale: "A social-dance DJ reads ensemble to gauge floor weight and authenticity: a Big Band fills a hall and drives an energetic Lindy crowd, a Solo Piano or Vocal+Piano duo sets a slow blues / late-night mood. It is the fastest single-value cue for 'how big does this sound' separate from BPM or genre."
    type: "enum"
    dj_use: "Balance big-band 'meat' against small-combo texture and alternate ensemble size for variety."
    other_tools: "No standard 'ensemble size/type' (orchestra / big band / combo / solo) field anywhere. Prior art only NAMES the ensemble as a credit: Discogs Roles 'Orchestra' / 'Ensemble [Quartet]' / 'Chorus'; MusicBrainz performer relationships (+ Classical Extras _cea_ensembles). ID3 has only TPE3 (Conductor). SDTS's instrumentation as a controlled enum of ensemble forms is SDTS-specific — tools record the ensemble's name, not its formation as a category."
    examples:
      - "Big Band"
      - "Jazz Combo"
      - "Solo Piano"
      - "Vocal + Piano"
      - "Manouche"
  - id: "instrument_led"
    display_name: "Instrument-Led"
    group: "taxonomy-core-b"
    layer: "taxonomy"
    status: "active"
    data_type: "enum"
    cardinality: "multi"
    value_source: "SDTS baseline vocabulary -> Instrument-Led (canonical names + aliases)"
    allowed_values: "Multi-value enum; multiple canonical values joined with '; '. Each value sits on a two-tier axis — specific instruments and generic instrument-family groupings — and must resolve to a canonical vocabulary name (aliases accepted). Stored BARE: any ' Led' suffix is stripped on read (e.g. 'Piano Led' -> 'Piano'). Value set: SDTS baseline vocabulary -> Instrument-Led (not enumerated here)."
    id3_current: "COMM:Songs-DB_Custom7 (lang XXX)"
    id3_proposed: "TXXX:SDTS_INSTRUMENT_LED"
    vorbis: "SDTS_INSTRUMENT_LED"
    mm5_mirror: true
    mp4: "----:com.apple.iTunes:SDTS_INSTRUMENT_LED"
    delimiter: "; "
    authority: "both"
    description: "The instrument(s) that carry or feature on the track — the lead voice(s), not the full instrument roster. Name a specific instrument when one dominates, or a generic family when no single instrument leads."
    rationale: "DJs program around featured instruments: a clarinet-led Goodman number, a harmonica-led Chicago blues, a piano-led stride tune each suit different rooms and dancers. Lets a DJ avoid stacking three sax features in a row, or pull an instrument theme set, which genre and ensemble alone cannot answer."
    type: "enum[]"
    dj_use: "Spot or avoid clustering similar-sounding lead instruments across a block."
    other_tools: "No 'featured/lead instrument' field anywhere. Prior art is instrument CREDITS (who played what, not which leads): MusicBrainz 'instrument' performer relationships (+ 'solo' attribute) -> performer:[instrument] / ID3 TMCL; Discogs instrument Roles with [bracket] refinements. SDTS's single 'leading instrument' value is SDTS-specific; the closest existing concept is a full credit list, not a chosen lead."
    examples:
      - "Piano"
      - "Saxophone"
      - "Clarinet"
      - "Reed"
      - "Trumpet; Trombone"
  - id: "recording_context"
    display_name: "Recording Context"
    group: "taxonomy-core-b"
    layer: "taxonomy"
    status: "active"
    data_type: "enum"
    cardinality: "single"
    value_source: "SDTS baseline vocabulary -> Recording Context (canonical names)"
    allowed_values: "Single enum value (cardinality: single) drawn from the vocabulary's recording-context vocabulary; resolve to the canonical name. Captures how the recording was captured (performance setting + provenance), kept separate from the technology window (recording_quality_era) and the precise release year (TDRC). Value set: SDTS baseline vocabulary -> Recording Context (not enumerated here)."
    id3_current: "COMM:Songs-DB_Custom8 (lang XXX) (id3-standards.md still lists Custom8 as 'reserved'; recording_context is the vocabulary-canonical binding)"
    id3_proposed: "TXXX:SDTS_RECORDING_CONTEXT"
    vorbis: "SDTS_RECORDING_CONTEXT"
    # No `mm5_mirror`: though it reuses COMM:Songs-DB_Custom8 like the mirrored fields, recording_context is
    # intentionally NOT in the legacy 7-field MediaMonkey sync mirror (MediaMonkeyFrames.Map). Do not add
    # `mm5_mirror: true` here without confirming the Sync engine should round-trip it (it would change behavior).
    mp4: "----:com.apple.iTunes:SDTS_RECORDING_CONTEXT"
    delimiter: "—"
    authority: "both"
    description: "How the recording was captured — its performance setting and provenance (studio session, live concert, radio/broadcast, film soundtrack, bootleg, jam, transcription disc). Distinct from recording_quality_era, which is the technology/fidelity window, and from TDRC, which is the precise release year."
    rationale: "Context shapes danceability and feel: a live or jam take carries crowd energy and looser timing a social floor responds to, while a clean studio cut is reliable for tight routines; bootleg/transcription flags quality and sourcing decisions a DJ needs before committing a track to a peak slot."
    type: "enum"
    dj_use: "Avoid dropping a talky live/applause track where you need a tight transition; choose studio vs live deliberately."
    other_tools: "Mainstream tools express context scattered and mostly at release level: MusicBrainz release-group secondary types Live/Soundtrack/Demo/Field-recording + 'Broadcast' primary type + 'Bootleg' release status + recording-level 'live'; Discogs Format Descriptions Live/Soundtrack/Promo (+ 'Unofficial Release' = bootleg); Apple '(Live)' title suffix. ID3 TMED is source-media (CD/Vinyl), not context. SDTS's unified studio/live/radio/soundtrack/bootleg track enum aligns conceptually with MusicBrainz secondary types but is SDTS-specific as one flat track field."
    examples:
      - "Studio"
      - "Live"
      - "Radio Broadcast"
      - "Jam Session"
  - id: "theme"
    display_name: "Theme (Listening / Event Context)"
    group: "taxonomy-core-b"
    layer: "taxonomy"
    status: "active"
    data_type: "enum"
    cardinality: "multi"
    value_source: "SDTS baseline vocabulary -> Themes (canonical bare-word values)"
    allowed_values: "Multi-value enum, '; '-separated; resolved to canonical theme names. Bare words only (seasonal / listening / event context) — #-prefixed dance-floor markers are NOT themes and belong to the dance/occasion side. Distinct from Mood (TMOO emotional fingerprint): theme is the listening/event situation, not the feel. Value set: SDTS baseline vocabulary -> Themes (not enumerated here)."
    id3_current: "COMM:Songs-DB_Custom9 (lang XXX) (id3-standards.md lists Custom9 as 'reserved'; themes is the vocabulary-canonical binding)"
    id3_proposed: "TXXX:SDTS_THEME"
    vorbis: "SDTS_THEME"
    mm5_mirror: true
    mp4: "----:com.apple.iTunes:SDTS_THEME"
    delimiter: "; "
    authority: "both"
    description: "The listening, event, or seasonal occasion a track suits (Christmas, Cocktail, Heartbreak, Late Night) — the situation a DJ programs for, beyond the track's musical identity. Distinct from Mood, which is the emotional feel: Theme=Love is the lyric topic while Mood=Tender is the feel; Theme=Driving is in-car listening while Mood=Driving is rhythmic motor. Also distinct from the dance/occasion side — listening-context themes are not dance-floor markers."
    rationale: "A DJ pulls by occasion as much as by sound: a Christmas/Wedding/Cocktail-hour set, a heartbreak blues block. These cut across genre and dance and are how the DJ slices the library for a specific room or event, so they earn a first-class field rather than living in free-text comments."
    type: "enum[]"
    dj_use: "Pull a holiday / Valentine / Halloween / event set on demand."
    other_tools: "Strong prior art for the CONCEPT: MusicMatch 'Situation' (Mood/Tempo/Situation/Preference) and MusicBee 'Occasion' (predefined list); Apple standardized 'Holiday' as a GENRE for seasonal music. NOTE: that de-facto 'Occasion/Situation' concept IS SDTS's theme (listening context) — but the reference implementation repurposed COMM:Songs-DB_Occasion for DANCE occasions, so theme lives in COMM:Songs-DB_Custom9 instead. The concept aligns with a real de-facto field; only the frame differs (by deliberate repurposing)."
    examples:
      - "Christmas"
      - "Cocktail; Late Night"
      - "Wedding"
      - "Heartbreak"
  - id: "recording_quality_era"
    display_name: "Recording Quality Era"
    group: "taxonomy-core-b"
    layer: "taxonomy"
    status: "active"
    data_type: "enum"
    cardinality: "single"
    value_source: "SDTS baseline vocabulary -> Recording Quality (canonical names; each value carries era_start/era_end + technology + frequency_range + character)"
    allowed_values: "Single enum value (cardinality 1, no delimiter). The value is a canonical recording-technology era name; each vocabulary value carries era_start/era_end, technology, frequency_range, and character attributes. Captures source-fidelity character, independent of release year (a modern reissue keeps its original-era character) and of recording_context. Value set: SDTS baseline vocabulary -> Recording Quality (not enumerated here)."
    id3_current: "TXXX:Quality (ad-hoc, frozen-legacy; vocabulary field name 'Quality'). NB: collides conceptually with the reference-implementation–private TXXX:SB-Quality (audio quality analyzer JSON, out of scope)."
    id3_proposed: "TXXX:SDTS_RECORDING_QUALITY_ERA"
    vorbis: "SDTS_RECORDING_QUALITY_ERA"
    mp4: "----:com.apple.iTunes:SDTS_RECORDING_QUALITY_ERA"
    delimiter: "—"
    authority: "both"
    description: "The recording-technology window a track was captured in, which sets its inherent fidelity ceiling — frequency range, mono vs stereo, surface noise. It describes the source's sonic character, not how good a particular copy is; a clean reissue master of an old acoustic cut still carries acoustic-era character."
    rationale: "Fidelity sets crowd tolerance: a noisy Acoustic/Electrical-Mono 78 reads as 'authentic' to a vintage Herräng room but thin on a big PA, while a Hi-Fi/Stereo master drives a modern floor harder. The DJ uses it to balance authenticity against sound-system impact when sequencing."
    type: "enum"
    dj_use: "Rank duplicate versions and judge whether a lo-fi acoustic-era recording suits the room and PA."
    other_tools: "SDTS-specific. WARNING: do NOT conflate with the 'Quality' field in MusicBee — that is a source/copy FIDELITY grade (Excellent/Good/Poor, ~10 options), NOT recording era. No tool models recording-technology era (acoustic/electrical/hi-fi/stereo/digital); Discogs exposes only Mono/Stereo/Quad as mastering descriptors and there is no ID3 frame."
    examples:
      - "Acoustic Era"
      - "Electrical Mono"
      - "Hi-Fi Mono"
      - "Stereo Era"
      - "Digital Era"
  - id: "song_form"
    display_name: "Song Form"
    group: "taxonomy-core-b"
    layer: "taxonomy"
    status: "active"
    data_type: "enum"
    cardinality: "single"
    value_source: "SDTS baseline vocabulary -> Song Forms (canonical names; each value carries bars/pattern/meter/tier)"
    allowed_values: "Single harmonic-form value (cardinality single; the '—' delimiter is irrelevant here as no multi-value lists are stored). Must be a canonical form name resolved against the vocabulary, which carries each value's bar count, section pattern, and implied meter; an 'Irregular' sentinel flags irregular phrasing. Harmonic form only — macro phrasing/breaks and section-by-section beat annotations live in the private SB-SongForm/SB-Beatinfos caches, not here. Value set: SDTS baseline vocabulary -> Song Forms (not enumerated here)."
    id3_current: "COMM:Songs-DB_Custom6 (lang XXX) per the song-form vocabulary. CONFLICT: docs/id3-tag-standards.md assigns Custom6 to SB-Quality JSON and binds harmonic form to the private TXXX:SB-SongForm cache — verify the live Custom6 allocation before migration."
    id3_proposed: "TXXX:SDTS_SONG_FORM"
    vorbis: "SDTS_SONG_FORM"
    mm5_mirror: true
    mp4: "----:com.apple.iTunes:SDTS_SONG_FORM"
    delimiter: "—"
    authority: "both"
    description: "The harmonic/structural form of a single chorus (12-bar blues, 32-bar AABA, multi-strain ragtime, etc.). This is the repeating chord-and-section template only — it does not capture where individual breaks or phrases land in this particular recording, nor any positional beat-by-beat annotation; those positional details are a separate, private concern."
    rationale: "Form is what an improvising/musical dancer hits: knowing a track is 12-bar blues vs 32-bar AABA tells the DJ where choruses and breaks land for jams and routines, and form predicts repetitiveness/length for the floor. It is the structural axis genre and BPM cannot express."
    type: "enum"
    dj_use: "Know the harmonic form (AABA / 12-bar) for routine matching and musicality cueing."
    other_tools: "No song-form tag anywhere — AABA / 12-bar / 32-bar are music-theory concepts living in human annotation or approximated by analysis-tool segment boundaries (Essentia/Sonic Visualiser; Rekordbox phrase labels are positional sections, not a form classification). SDTS's categorical song_form (+ bar count) is genuinely SDTS-specific; adjacent to segment analysis with no de-facto tag."
    examples:
      - "12-bar Blues"
      - "AABA"
      - "ABAC"
      - "Ragtime"
      - "Rhythm Changes"
  - id: "bpm"
    display_name: "BPM (raw)"
    group: "measured-confirmation"
    layer: "measured"
    status: "active"
    data_type: "int"
    cardinality: "single"
    value_source: "derived-from-audio (beat-grid / Essentia) then human-confirmable; numeric range"
    allowed_values: "positive integer, ~40-330 (covers Slow Drag floor ~40 to St. Louis Shag / Bebop ceiling ~300-320 per ontology tempo_range bands); stored as a whole number"
    id3_current: "TBPM (frozen standard frame)"
    id3_proposed: "TBPM — keep the standard frame; do NOT mint TXXX:SDTS_BPM (routing rule 1: standard concept with a real ID3 frame uses the frame)."
    vorbis: "BPM"
    mp4: "tmpo (native MP4 integer atom) — freeform ----:com.apple.iTunes:BPM only as fallback"
    delimiter: "— (single value, no delimiter)"
    authority: "reference-impl"
    description: "The raw machine-measured beats-per-minute of the track, written as an integer to the standard TBPM frame. It is the literal pulse rate from the beat grid, NOT the tempo a dancer perceives — half/double-time tracks carry their raw value here (set it to the danced pulse if your detector mis-locks on a subdivision). Auto-derivable from the SB-Beats cache; once a user confirms it the BPM confirmation gate (Custom10) protects it."
    rationale: "Tempo is the first filter a social-dance DJ applies — each dance has a workable band (Lindy ~120-240, Balboa ~180-300, Blues ~50-120, Slow Drag ~40-70). Raw BPM must stay un-rewritten so confirmed half-time fixes (e.g. Ella 'Rug Cutter' at 250) survive every re-analysis pass; that is exactly why it is gate-protected."
    type: "int (BPM, integer)"
    dj_use: "The primary set-building filter — find tracks inside the dance's tempo window."
    other_tools: "Fully universal: TBPM (integer per spec) / MP4 tmpo / WM/BeatsPerMinute / Vorbis BPM. SDTS aligns with TBPM (fractional BPM is non-conformant in TBPM)."
    examples:
      - "120"
      - "186"
      - "250"
  - id: "rating"
    display_name: "Rating"
    group: "measured-confirmation"
    layer: "measured"
    status: "active"
    data_type: "int"
    cardinality: "single"
    value_source: "user judgement; half-star scale stored as a POPM popularity byte"
    allowed_values: "0-5 stars in half-star steps internally (0, 0.5 … 5.0 → 11 levels); on disk a single POPM popularimeter byte 0-255 (the canonical MM-compatible mapping, byte families per half-star — see POPM byte 32 note)"
    id3_current: "POPM with email/owner 'no@email' (frozen) — the popularity byte is the on-disk source of truth"
    id3_proposed: "POPM (keep). A 0-5 star rating is the POPM frame's defined purpose; do NOT reinvent it as TXXX:SDTS_RATING — it would shadow a real frame and break every other tagger that reads POPM."
    vorbis: "RATING (de-facto 0-100; map the 11 half-star levels onto the 0-100 convention on write)"
    mp4: "----:com.apple.iTunes:RATING (or rate atom) — 0-100 convention"
    delimiter: "— (single value, no delimiter)"
    authority: "reference-impl"
    description: "The DJ's quality/usability rating of the track on a 0-5 scale in half-star increments. Internally carried as half-stars; on disk it is a single POPM popularity byte under owner 'no@email' so MediaMonkey and JRiver read the same stars. It is a workflow judgement (is this track worth playing), distinct from danceability or energy."
    rationale: "A DJ prunes a large library down to gig-ready tracks; the star rating is the at-a-glance keep/skip signal surfaced next to the Custom2 pool marker in the editor. POPM (not a custom TXXX) is mandatory because MM5 and JRiver both sort and filter on the native rating column."
    type: "rating"
    dj_use: "Your fastest trust signal mid-set — 'which of my 150-BPM tracks is actually a killer'."
    other_tools: "POPM — but keyed per-app by an email identifier (MediaMonkey, MusicBee, traktor@native-instruments.de, Windows Media Player) and the 0-255→stars mapping differs per app, so cross-app rating is lossy. SDTS uses POPM 'no@email' with the reference implementation's verified bytes."
    examples:
      - "5 (=POPM 255)"
      - "3.5"
      - "0 (unrated)"
  - id: "confirmation_gates"
    display_name: "Confirmation gates (Custom10)"
    group: "measured-confirmation"
    layer: "confirmation"
    status: "active"
    data_type: "composite"
    cardinality: "multi"
    value_source: "user confirmation actions + 3-state content-CRC tamper detection; open field-id-keyed gate vocabulary with per-gate integer version"
    allowed_values: "semicolon-separated '<field-id>:<version>[:<crc>]' entries — the wire token is the confirmed field's id (e.g. bpm:1, genre:2). Version is a positive integer ≥1 (increments on re-confirmation, bpm:1 → bpm:2). The OPTIONAL 3rd part is a 4-char hex content checksum (compact CRC) for tamper detection. The gate vocabulary is OPEN — any field is gate-able (a core field or a consumer's extension field); a token that is neither a canonical field id nor a profile alias is preserved verbatim and flagged for remediation. 3-state per gate: absent=ungated, version≥1=verified, tamper-flagged when the stored 4-char checksum mismatches the recomputed content checksum."
    id3_current: "COMM:Songs-DB_Custom10 (lang XXX) (frozen legacy COMM frame)"
    id3_proposed: "TXXX:SDTS_CONFIRMATION_GATES (proposed). This is the reference implementation's confirmation state, not a taxonomy vocabulary value, so it has no legacy column to preserve and the portable TXXX target costs nothing — but freeze the current COMM frame as legacy until the writer dual-writes."
    vorbis: "SDTS_CONFIRMATION_GATES"
    mp4: "----:com.apple.iTunes:SDTS_CONFIRMATION_GATES"
    delimiter: "; (semicolon-space)"
    authority: "reference-impl"
    description: "Per-category ledger of which logical fields the user has hand-verified, forming the trust boundary that protects curated values from automated overwrites. The reference implementation reads it before touching a gated field: heuristic auto-corrections (BPM half-time fix, alias normalization) must refuse the write unless the caller explicitly forces a re-analyze, and a merge/bulk edit that genuinely changes a field clears that field's gate (audio-derived gates are preserved since their inputs aren't merged)."
    rationale: "Without this ledger every analysis pass undoes the DJ's hand-corrections — a confirmed half-time BPM gets re-doubled, a curated genre gets re-aliased. The version number lets a future Beats v2 flag stale Beats:1 confirmations. It is the trust boundary that makes automated enrichment safe on a human-curated library."
    type: "object[] (Category:version)"
    dj_use: "Lock human-verified fields so auto-suggestions / re-analysis don't overwrite your confirmed calls."
    other_tools: "No tagger has a per-field 'verified/confirmed' marker in the file. Loose analogues: MusicBrainz's community data-quality rating (low/normal/high, not in your tags) and DJ-app beatgrid 'lock' flags (app-internal). SDTS's Custom10 gates (per-field confirmed state + CRC32 tamper detection) are genuinely SDTS-specific and go well beyond any analogue."
    examples:
      - "BPM:1:a3f2; Genres:1; Moods:2"
      - "Beats:1; Structure:1; Segments:1"
      - "Occasions:1; Comments:1; Lyrics:1"
  - id: "sdts_version"
    display_name: "SDTS schema version"
    group: "measured-confirmation"
    layer: "meta"
    status: "active"
    data_type: "string"
    cardinality: "single"
    value_source: "the SDTS schema/spec version this file was last normalized to (semver, e.g. 0.1.0)"
    allowed_values: "semver string (e.g. '0.1.0'); compared on load to decide whether to migrate / re-normalize"
    id3_current: "n/a (new field)"
    id3_proposed: "TXXX:SDTS_VERSION"
    vorbis: "SDTS_VERSION"
    mp4: "----:com.apple.iTunes:SDTS_VERSION"
    delimiter: "—"
    authority: "reference-impl"
    description: "The SDTS schema version the file was last written / normalized under. On load the toolkit compares it to the current version: older -> run the relevant migrations and re-normalize; equal -> skip. Makes normalization cheap and idempotent. Distinct from SB-Migrations (one-shot per-migration tokens) — this is the single 'where is this file at' watermark."
    rationale: "Turns normalization into a one-line version check instead of re-running every heuristic on every load — standard schema-versioning practice; makes library-wide migrations safe and resumable."
    type: "string"
    dj_use: "Skip files already at the current standard and migrate only older ones — fast, idempotent normalization."
    other_tools: "No tagger has a per-file schema-version watermark; the closest is the reference implementation's own SB-Migrations one-shot tokens. MusicBrainz/Discogs have nothing comparable. SDTS-specific — analogous to a database schema_version row."
    examples:
      - "0.1.0"
      - "0.2.0"
  - id: "energy"
    display_name: "Energy"
    group: "proposed-tempo-structure"
    layer: "measured"
    status: "proposed"
    data_type: "int"
    cardinality: "single"
    value_source: "numeric range (1-10); human-set, optionally seeded from audio energy estimate"
    allowed_values: "discrete integer 1-10 (1 = lowest floor-drive, 10 = peak; ~5-6 typical). Part of the 1-10 rating-scale family. Stored as a plain integer in TXXX:SDTS_ENERGY — NOT a 0-255 byte."
    id3_current: "n/a (new field) — today only implicit in TMOO via the mood's energy axis"
    id3_proposed: "TXXX:SDTS_ENERGY (docs previously floated TXXX:SB_ENERGY to avoid the contested bare ENERGYLEVEL; SDTS uses SDTS_ENERGY)"
    vorbis: "SDTS_ENERGY"
    mp4: "----:com.apple.iTunes:SDTS_ENERGY"
    delimiter: "— (single value)"
    authority: "reference-impl"
    description: "A standalone 1-10 floor-drive rating, independent of both BPM and the mood's valence. Captures how hard a track pushes the room: a slow grinding blues can be energy 8 at 70 BPM; a bright mid-tempo novelty can be energy 3. Decouples the 'how much does this lift the floor' lever from the energy×valence mood grid, which is too coarse (only high/medium/low and always tied to brightness)."
    rationale: "Energy is THE set-pacing lever for building and releasing a night's arc, but the mood grid welds energy to valence (you cannot say 'high energy, dark') and offers only three steps. A 1-10 standalone field lets the DJ sequence opener→builder→peak→cooldown by drive rather than by tempo or mood. Chosen as 1-10 (not 1-5 or 0-100): ten steps give finer set-pacing granularity than five, and it aligns with Mixed In Key's ENERGYLEVEL 1-10 read-alias."
    type: "rating"
    dj_use: "Build the night's energy arc and contrast — pull an opener, a builder, a peak, a cool-down."
    other_tools: "No standardized energy frame. Mixed In Key writes energy as TXXX:EnergyLevel / ENERGYLEVEL (casing inconsistent across versions; some versions push 'Energy N' into the COMM comment), read by Serato/Traktor; beaTunes/Spotify expose computed values. SDTS uses a clean structured TXXX:SDTS_ENERGY (consider documenting ENERGYLEVEL as a read alias) rather than overloading COMM. The 1-10 is the human analogue of the Spotify/Echo Nest 'energy' (arousal/intensity) audio feature (0.0-1.0); Spotify deprecated that endpoint for new apps on 2024-11-27 — a practical reason to store it as a first-class tag."
    examples:
      - "3"
      - "5"
      - "8"
  - id: "valence"
    display_name: "Valence"
    group: "proposed-tempo-structure"
    layer: "measured"
    status: "proposed"
    data_type: "int"
    cardinality: "single"
    value_source: "numeric range (1-10); human-set, optionally seeded from the track's moods or an audio valence estimate"
    allowed_values: "discrete integer 1-10 (1 = darkest, 10 = brightest; ~5-6 typical). Part of the 1-10 rating-scale family, and the same substrate as the mood dimension's valence axis. Stored as a plain integer in TXXX:SDTS_VALENCE — NOT a 0-255 byte."
    id3_current: "n/a (new field) — today only implicit in TMOO via the mood's valence axis"
    id3_proposed: "TXXX:SDTS_VALENCE"
    vorbis: "SDTS_VALENCE"
    mp4: "----:com.apple.iTunes:SDTS_VALENCE"
    delimiter: "— (single value)"
    authority: "reference-impl"
    description: "A standalone 1-10 brightness rating — the valence half of the energy × valence pair, carried as its own field exactly as energy is. Captures how dark or bright the record reads: a driving minor-key stomp can be energy 8 / valence 3, a gentle sunny ballad energy 3 / valence 8. Independent of BPM and of which moods are tagged."
    rationale: "Energy became a standalone field because the mood grid welds drive to brightness; the identical argument holds for the other axis, and leaving it out left the grid half-tagged. A track carries zero or more moods, so a consumer wanting one valence coordinate must fold a multi-value set through a rule the standard does not define — and gets nothing at all for an untagged track. A first-class field makes the coordinate a stated fact instead of a per-consumer inference. Kept at 1-10 so track valence, track energy and the vocabulary's own energy/valence axes share one substrate and can be compared without rescaling; any 3x3 / 5x5 discretisation stays a consumer choice."
    type: "rating"
    dj_use: "Pick by brightness independently of drive — a dark peak, a bright cool-down — and avoid jarring valence jumps between records."
    other_tools: "No tagger has a valence frame: Mixed In Key writes energy only, beaTunes and MediaMonkey expose mood text. The 1-10 is the human analogue of the Spotify/Echo Nest 'valence' audio feature (0.0-1.0, deprecated for new apps 2024-11-27) and of Essentia's valence models — a practical reason to store it as a first-class tag rather than re-derive it. The axis itself is the valence dimension of Russell's circumplex model of affect (1980), the same plane the mood vocabulary is placed on."
    examples:
      - "3"
      - "6"
      - "9"
  - id: "tempo_stability"
    display_name: "Tempo Stability"
    group: "proposed-tempo-structure"
    layer: "derived"
    status: "proposed"
    data_type: "enum"
    cardinality: "single"
    value_source: "derived-from-audio (variance of SB-Beats inter-beat intervals) then human-confirmed"
    allowed_values: "stable | drift | rubato | accelerando | tempo-change (closed enum). stable = tight grid; drift = slow human wander; rubato = expressive free time; accelerando = sustained speed-up; tempo-change = one or more abrupt section tempo shifts."
    id3_current: "n/a (new field) — today only implicit in the SB-Beats grid, never summarized"
    id3_proposed: "TXXX:SDTS_TEMPO_STABILITY"
    vorbis: "SDTS_TEMPO_STABILITY"
    mp4: "----:com.apple.iTunes:SDTS_TEMPO_STABILITY"
    delimiter: "— (single value)"
    authority: "reference-impl"
    description: "A one-word summary of how steady the pulse is across the track, derived from the variance of the SB-Beats inter-beat intervals. 'stable' tracks are safe for back-to-back mixing; 'rubato'/'accelerando'/'tempo-change' warn the DJ of a moving target that may strand dancers or break a transition."
    rationale: "DJs actively avoid abrupt tempo changes mid-set; a flat BPM number hides them entirely. Because SB-Beats already exists, this is machine-computable (beat-interval variance) and only needs human confirmation on edge cases. Overlaps conceptually with the legacy #C 'Challenging' marker but is a measured, specific axis rather than a catch-all difficulty flag."
    type: "enum"
    dj_use: "Avoid rubato / tempo-change tracks when you need a steady, beatmatchable floor."
    other_tools: "No tempo-stability tag anywhere. FALSE FRIEND: MusicBee/MusicMatch have a 'Tempo' field, but it is a slow/medium/fast SPEED bucket, not stability. Analysis tools give beat positions (drift derivable) and DJ apps have warp/dynamic beatgrids, but neither persists a stable/drift/rubato/tempo-change label. SDTS-specific."
    examples:
      - "stable"
      - "rubato"
      - "accelerando"
  - id: "meter"
    display_name: "Meter"
    group: "proposed-tempo-structure"
    layer: "taxonomy"
    status: "proposed"
    data_type: "enum"
    cardinality: "single"
    value_source: "controlled enum — a full time signature OR a bare beats-per-bar grouping; owned by the SDTS baseline vocabulary; derivable from beat grouping then human-confirmed"
    allowed_values: "Either a full time signature (4/4 | 3/4 | 6/8 | 12/8 | 2/4) OR — when the denominator is unknown or irrelevant for dancing — just the beats-per-bar GROUPING (2 | 3 | 4). Both forms are valid and both are accepted; '3' covers the waltz family whether it is notated 3/4 or 3/8. The slash, where present, is literal (NOT a multi-value delimiter). Triplet/compound SUBDIVISION (e.g. 12/8 vs straight 4/4) is captured by rhythmic_feel, not here."
    id3_current: "n/a (new field) — today only implied per-form via the forms 'meter' axis, never stored on the track"
    id3_proposed: "TXXX:SDTS_METER"
    vorbis: "SDTS_METER"
    mp4: "----:com.apple.iTunes:SDTS_METER"
    delimiter: "— (single value; internal '/' is literal, never a delimiter)"
    authority: "both"
    description: "The meter of the track — either the full time signature OR just the beats-per-bar grouping (2/3/4) when you do not know or do not care about the denominator. Makes it a hard gate: only a 3-feel (3, 3/4, 3/8) qualifies for Waltz (#WLZ) / Tango-Vals (#TGW); the rest is a 2- or 4-feel. Triplet vs straight (e.g. 12/8 vs 4/4) is rhythmic_feel's job."
    rationale: "The waltz family needs a 3-feel gate, but the denominator (3/4 vs 3/8) rarely matters for dancing and is often unknown — so the standard accepts BOTH the full signature and the bare grouping ('3'). Subdivision (shuffle/triplet) belongs to rhythmic_feel, so meter need not carry it. The slash (when used) round-trips human-readably across taggers."
    type: "enum (2 | 3 | 4 | 2/4 | 3/4 | 4/4 | 6/8 | 12/8)"
    dj_use: "Gate 3/4 waltz-family material apart from 4/4."
    other_tools: "CONFIRMED no standard time-signature/meter tag in ID3 (v2.3/2.4), MP4/iTunes, or MusicBrainz. The only precedent is a marginal, unreliable 'MEASURE' Vorbis-comment convention (FLAC/OGG only; Hydrogenaudio flags it). For MP3/ID3 — SDTS's target — meter is effectively fresh; SDTS-specific with a Vorbis MEASURE footnote."
    examples:
      - "4/4"
      - "3"
      - "3/4"
      - "12/8"
  - id: "intro_duration"
    display_name: "Intro Duration"
    group: "proposed-tempo-structure"
    layer: "derived"
    status: "proposed"
    data_type: "int"
    cardinality: "single"
    value_source: "milliseconds — length of the intro before the groove lands (derived from SB-Beats/segments, human-confirmable)"
    allowed_values: "non-negative integer milliseconds — how long until the danceable groove starts. 0 = drops straight in. The player MAY flag an 'uncomfortably long' intro above a threshold."
    id3_current: "n/a (new field)"
    id3_proposed: "TXXX:SDTS_INTRO_DURATION"
    vorbis: "SDTS_INTRO_DURATION"
    mp4: "----:com.apple.iTunes:SDTS_INTRO_DURATION"
    delimiter: "—"
    authority: "reference-impl"
    description: "How long the intro runs before the danceable groove lands, in ms. DESCRIPTIVE — not a trim instruction (that is playback_start) — so the editor/player can flag a long talky/rubato/count-in intro. Auto-derivable from the beat grid (time to the first strong downbeat)."
    rationale: "Social DJs favour short runways; a long intro before the groove is a known annoyance (the legacy #CP 'Cut Potential' marker). A plain ms scalar is queryable ('intro_duration > 8000 = long'); split out of the old intro_outro JSON composite (no JSON in a tag)."
    type: "int (ms)"
    dj_use: "Spot tracks with an uncomfortably long intro before the groove."
    other_tools: "Positional prior art marks WHERE not how-long: ID3 ETCO ($02 intro start), BWF cart INTs/INTe, Mixed In Key intro cue. SDTS stores the LENGTH as a plain scalar."
    examples:
      - "0"
      - "4200"
      - "12000"
  - id: "outro_duration"
    display_name: "Outro Duration"
    group: "proposed-tempo-structure"
    layer: "derived"
    status: "proposed"
    data_type: "int"
    cardinality: "single"
    value_source: "milliseconds — length of the outro/tail after the last groove (derived from SB-Beats/segments, human-confirmable)"
    allowed_values: "non-negative integer milliseconds — how long the outro/tail runs. 0 = ends on the groove. The player MAY flag a long fade / applause tail above a threshold."
    id3_current: "n/a (new field)"
    id3_proposed: "TXXX:SDTS_OUTRO_DURATION"
    vorbis: "SDTS_OUTRO_DURATION"
    mp4: "----:com.apple.iTunes:SDTS_OUTRO_DURATION"
    delimiter: "—"
    authority: "reference-impl"
    description: "How long the outro/tail runs after the last danceable groove, in ms. DESCRIPTIVE — not a trim instruction (that is playback_stop) — so the editor/player can flag a long fade or applause tail. Pairs with ending_type. Auto-derivable from the beat grid and segment boundaries."
    rationale: "DJs cut long tails for tight transitions; a plain ms scalar is queryable and was split out of the old intro_outro JSON composite (no JSON in a tag)."
    type: "int (ms)"
    dj_use: "Spot tracks with a long fade / applause tail."
    other_tools: "Positional prior art: ID3 ETCO ($04/$05 outro start/end), BWF cart OUTs/OUTe. SDTS stores the LENGTH as a plain scalar."
    examples:
      - "0"
      - "3000"
      - "11000"
  - id: "ending_type"
    display_name: "Ending Type"
    group: "proposed-tempo-structure"
    layer: "derived"
    status: "proposed"
    data_type: "enum"
    cardinality: "single"
    value_source: "enum (controlled vocab) — how the track ends; derived from segments then human-confirmed"
    allowed_values: "One of: definitive (clear resolved ending) | fade (volume fade-out) | cold-stop (abrupt cut). Unset = unknown."
    id3_current: "n/a (new field)"
    id3_proposed: "TXXX:SDTS_ENDING_TYPE"
    vorbis: "SDTS_ENDING_TYPE"
    mp4: "----:com.apple.iTunes:SDTS_ENDING_TYPE"
    delimiter: "—"
    authority: "both"
    description: "How the track ends — a definitive resolved ending, a fade-out, or a cold stop. The genuinely distinct part of the old intro_outro composite: lets the editor flag fade/cold-stop endings that hurt social-dance flow and the player time transitions."
    rationale: "Social dancers want to know when to finish; definitive endings are best, fades / cold-stops need handling. A cheap confirmed enum, split out of the intro_outro JSON."
    type: "enum"
    dj_use: "Know the ending (definitive / fade / cold-stop) for tight transitions."
    other_tools: "No tool stores an ending-type. Adjacent: ID3 ETCO outro markers (positional). SDTS-specific small enum."
    examples:
      - "definitive"
      - "fade"
      - "cold-stop"
  - id: "playback_start"
    display_name: "Playback Start (cue-in)"
    group: "proposed-tempo-structure"
    layer: "derived"
    status: "proposed"
    data_type: "int"
    cardinality: "single"
    value_source: "milliseconds from the file start (absent or 0 = play from the beginning); optionally a beat index via the SB-Beats grid"
    allowed_values: "non-negative integer milliseconds; must be < playback_stop and < track length. Absent/0 = start at 0:00."
    id3_current: "n/a (new field) — no tool writes a playback start to the file; JRiver [Playback Range] and iTunes Start Time are library-DB-only"
    id3_proposed: "TXXX:SDTS_PLAYBACK_START"
    vorbis: "SDTS_PLAYBACK_START"
    mp4: "----:com.apple.iTunes:SDTS_PLAYBACK_START"
    delimiter: "—"
    authority: "reference-impl"
    description: "The point (ms from the start of the file) where playback should begin — the cue-in. Trims dead air, a long count-in, or a rubato/spoken intro so the danceable part starts immediately. Absent or 0 means start at the beginning. Distinct from intro_duration, which only *describes* the intro length; playback_start is the actual instruction to skip it. (JRiver expresses the pair as one string field [Playback Range] = \"cue-in - cue-out\"; SDTS uses two scalars for easier validation.)"
    rationale: "A social-dance DJ wants tracks to drop straight into the groove — no 6 s of crowd noise or a free-time piano intro before the beat. JRiver ([Playback Range]) and iTunes (Start Time) offer this but keep it in their database, so it is lost the moment the file moves machines or apps. A portable in-file cue-in is exactly what a portable DJ standard should carry."
    type: "int (ms)"
    dj_use: "Skip a long talky / applause / rubato intro so the track drops straight into the groove."
    other_tools: "JRiver [Playback Range] (cue-in side) and iTunes 'Start Time' (ms) do exactly this but keep it library-DB-only, so it does not travel with the file. No ID3 standard exists for a play-from-here instruction; the nearest standard markers are ID3 ETCO (intro / main-part-start / outro event timing, in ms) and the BWF 'cart' / WAV 'cue ' chunks (positional marks, in samples) — but those are descriptive, rarely populated, and heavier than a value. SDTS uses a plain, writable TXXX:SDTS_PLAYBACK_START (also emitting ETCO markers is a possible future interop nicety). Resume/bookmark is a separate runtime concept, intentionally not an SDTS field."
    examples:
      - "8000"
      - "0"
      - "12500"
  - id: "playback_stop"
    display_name: "Playback Stop (cue-out)"
    group: "proposed-tempo-structure"
    layer: "derived"
    status: "proposed"
    data_type: "int"
    cardinality: "single"
    value_source: "milliseconds from the file start (absent = play to the end); optionally a beat index via the SB-Beats grid"
    allowed_values: "positive integer milliseconds; must be > playback_start and <= track length. Absent = play to the end."
    id3_current: "n/a (new field) — JRiver [Playback Range] / iTunes Stop Time are library-DB-only"
    id3_proposed: "TXXX:SDTS_PLAYBACK_STOP"
    vorbis: "SDTS_PLAYBACK_STOP"
    mp4: "----:com.apple.iTunes:SDTS_PLAYBACK_STOP"
    delimiter: "—"
    authority: "reference-impl"
    description: "The point (ms) where playback should stop — the cue-out. Cuts a long fade-out, an applause tail, or hidden-track silence so the next track comes in cleanly. Absent means play to the end. Pairs with playback_start as the portable equivalent of JRiver [Playback Range] / iTunes Stop Time."
    rationale: "DJs cut the dead tail / applause to keep floor transitions tight. JRiver and iTunes both support a stop point but store it DB-side only; SDTS makes it travel with the file. Note: this is a fixed cue-out, NOT a resume/bookmark (a moving runtime value, deliberately out of scope)."
    type: "int (ms)"
    dj_use: "Cut a fade-out or applause tail so the next track comes in tight."
    other_tools: "JRiver [Playback Range] (cue-out side) and iTunes 'Stop Time' (ms) do this but keep it library-DB-only — lost when the file moves. Nearest standard markers: ID3 ETCO 'outro start/end' (ms) and BWF cart / WAV cue marks (samples), but descriptive and rarely populated. SDTS carries a plain TXXX:SDTS_PLAYBACK_STOP."
    examples:
      - "195000"
      - "201500"
  - id: "fade_in_duration"
    display_name: "Fade-in"
    group: "proposed-tempo-structure"
    layer: "derived"
    status: "proposed"
    data_type: "int"
    cardinality: "single"
    value_source: "milliseconds — fade-in ramp length starting at playback_start (0 or absent = hard/instant entry)"
    allowed_values: "non-negative integer milliseconds; 0 = no fade (hard in). Typically 0-4000."
    id3_current: "n/a (new field) — no container stores a fade duration (not ID3, not the BWF 'cart' chunk)"
    id3_proposed: "TXXX:SDTS_FADE_IN_DURATION"
    vorbis: "SDTS_FADE_IN_DURATION"
    mp4: "----:com.apple.iTunes:SDTS_FADE_IN_DURATION"
    delimiter: "—"
    authority: "reference-impl"
    description: "Length of a fade-in ramp applied from playback_start (the cue-in). 0 or absent = hard entry (no fade). Lets a track ease in from its chosen cue point instead of jumping in. The fade CURVE is not stored — the player picks it (default equal-power); add a fade_curve field only if some track needs a non-default shape."
    rationale: "Eases a track in from its cue-in for a smoother floor entry. No tool stores fade as metadata (it is a live auto-mix behaviour everywhere), so this is net-new and travels with the file."
    type: "int (ms)"
    dj_use: "Ease a track in from its cue-in instead of a hard entry."
    other_tools: "No standardized fade representation exists anywhere — not in ID3v2 (no fade frame; closest are RVA2 gain and ETCO event markers), and not even in the broadcast BWF 'cart' chunk (only positional time-marks, no fade duration or curve). DJ tools treat fading as a live auto-mix behavior, never a saved per-track value. So fade_in_duration is net-new; the player chooses the curve (default equal-power)."
    examples:
      - "0"
      - "1500"
      - "2000"
  - id: "fade_out_duration"
    display_name: "Fade-out"
    group: "proposed-tempo-structure"
    layer: "derived"
    status: "proposed"
    data_type: "int"
    cardinality: "single"
    value_source: "milliseconds — fade-out ramp length ENDING at playback_stop (0 or absent = cold stop)"
    allowed_values: "non-negative integer milliseconds; 0 = cold stop (no fade). Typically 0-8000."
    id3_current: "n/a (new field) — JRiver/iTunes/DJ tools handle fade at runtime; no in-file fade field anywhere"
    id3_proposed: "TXXX:SDTS_FADE_OUT_DURATION"
    vorbis: "SDTS_FADE_OUT_DURATION"
    mp4: "----:com.apple.iTunes:SDTS_FADE_OUT_DURATION"
    delimiter: "—"
    authority: "reference-impl"
    description: "Length of a fade-out ramp that ENDS at playback_stop (the cue-out). 0 or absent = cold stop. Your example — end at 200 s with a 2 s fade — is playback_stop=200000, fade_out_duration=2000 (clean, no '+'-as-arithmetic ambiguity). Curve not stored; player default equal-power."
    rationale: "Cuts a track's tail with a clean fade instead of a hard stop, for tight transitions. Net-new — fade duration has no standard or de-facto in-file representation (confirmed: not ID3, not the BWF cart chunk, not DJ tools)."
    type: "int (ms)"
    dj_use: "Tame a fade-ending or applause-tailed record with a clean fade."
    other_tools: "Same as fade_in_duration — no container (ID3 / BWF cart / DJ tools) stores a fade duration or curve; fade is universally a runtime behavior. SDTS makes it a portable, file-resident value; curve is chosen by the player (default equal-power)."
    examples:
      - "0"
      - "2000"
      - "4000"
  - id: "routine"
    display_name: "Routine"
    group: "proposed-dance-semantic"
    layer: "taxonomy"
    status: "proposed"
    data_type: "enum"
    cardinality: "multi"
    value_source: "SDTS baseline vocabulary -> Routines (canonical names + aliases)"
    allowed_values: "Multi-value, '; '-delimited list of canonical routine names stored as plain canonical text with spaces; spaceless forms are aliases that resolve to the canonical name ('#'-prefixed forms are personal shorthand for a personal overlay, not baseline aliases). Each name carries an inline fitness tier ':original' / ':alternative' / ':experimental' (original = the canonical recording the routine is danced to; alternative = an accepted substitute; experimental = fits but demands more of the dancers) plus an optional trailing '?' meaning needs validation. One track may be the original for one routine and an alternative/experimental for another; consumers strip ':tier' and a trailing '?' to filter by routine. Pairs with the matching dance tag rather than replacing it. Value set: SDTS baseline vocabulary -> Routines (not enumerated here)."
    id3_current: "n/a (new field)"
    id3_proposed: "TXXX:SDTS_ROUTINES"
    vorbis: "SDTS_ROUTINES"
    mp4: "----:com.apple.iTunes:SDTS_ROUTINES"
    delimiter: "; "
    authority: "both"
    description: "Names the choreographed line routines (Shim Sham, Tranky Doo, Big Apple, Jitterbug Stroll) that this exact recording serves, and how well it fits each. Genre, mood, BPM, and even the dance tag only say a track fits the style; this field says THIS specific recording is the one the routine is actually danced to — whether the original accompaniment, an accepted substitute, or an experimental stretch."
    rationale: "Per handoff section B (high priority) and section A, line routines (Shim Sham, Tranky Doo, Big Apple, Jitterbug Stroll) are the highest-value single gap — they are danced to one specific recording, a fact genre/mood/BPM structurally cannot encode. The original/alternative/experimental tier lets the DJ pull THE track first and fall back to vetted substitutes — or risk an experimental one for an advanced crowd — instead of keeping a mental/paper list."
    type: "enum[]"
    dj_use: "Pull THE Shim Sham / Big Apple / Tranky Doo track (original), with vetted alternatives and experimental options behind it."
    other_tools: "No prior art. Marking a track as the accompaniment to a fixed choreographed routine (Shim Sham, Tranky Doo, Big Apple) — and grading how well it fits — is a swing-dance-culture concept with zero counterpart in any tagging standard/library; others would only use an ad-hoc keyword/playlist. Fully SDTS-specific."
    examples:
      - "Shim Sham:original"
      - "Shim Sham:alternative; Big Apple:experimental"
      - "Tranky Doo:original"
  - id: "danceability"
    display_name: "Danceability"
    group: "proposed-dance-semantic"
    layer: "measured"
    status: "proposed"
    data_type: "int"
    cardinality: "single"
    value_source: "numeric range 1–10; human-set, optionally seeded from beat-clarity in SB-Beats analysis then human-confirmed"
    allowed_values: "discrete integer 1-10 (1 = barely danceable / listening-only, 10 = irresistible floor track). Part of the 1-10 rating-scale family. Plain integer in TXXX:SDTS_DANCEABILITY."
    id3_current: "n/a (new field)"
    id3_proposed: "TXXX:SDTS_DANCEABILITY"
    vorbis: "SDTS_DANCEABILITY"
    mp4: "----:com.apple.iTunes:SDTS_DANCEABILITY"
    delimiter: "—"
    authority: "reference-impl"
    description: "A 1–10 beat-clarity / floor-readiness score answering \"is this danceable, or is it a listening track?\" — the single dimension DJ guides rank above genre and BPM. It decouples \"good music\" from \"good FLOOR music\": a beloved torch ballad can be a 2, an average jump tune a 5. Auto-derivable as a first pass from beat-grid pulse strength in the SB-Beats cache, then human-confirmed (gate-able)."
    rationale: "Per handoff section B (medium priority): \"DJ guides rank danceability above genre/BPM.\" The current taxonomy has no way to flag a track as listening-only versus floor-filling; energy and BPM both miss it (high-energy listening pieces exist). A confirmable numeric makes \"pull me only the 4s and 5s\" possible."
    type: "rating"
    dj_use: "Separate genuine floor tracks from listening-only music."
    other_tools: "No native tag field in any tagger; exists only as a computed value (Echo Nest 0-1 / Essentia / Spotify Audio Features), stored ad-hoc in TXXX or a DB. SDTS defines TXXX:SDTS_DANCEABILITY as the human-confirmed 1-10 analogue; Spotify deprecated its audio-features endpoint for new apps on 2024-11-27, so the open computed source is Essentia/AcousticBrainz."
    examples:
      - "10"
      - "5"
      - "2"
  - id: "lyric_language"
    display_name: "Lyric Language"
    group: "proposed-content-provenance"
    layer: "taxonomy"
    status: "proposed"
    data_type: "enum"
    cardinality: "multi"
    value_source: "controlled enum — ISO 639-1 two-letter language codes (SDTS controlled vocabulary; new field, proposed)."
    allowed_values: "ISO 639-1 codes, e.g. en, fr, de, it, es, sl; plus the sentinel \"instrumental\" for no-lyric tracks (cross-check against Vocality=Instrumental). Multi-value for bilingual/multilingual tracks. Unset = unknown."
    id3_current: "n/a (new field)"
    id3_proposed: "TXXX:SDTS_LYRIC_LANGUAGE"
    vorbis: "SDTS_LYRIC_LANGUAGE"
    mp4: "----:com.apple.iTunes:SDTS_LYRIC_LANGUAGE"
    delimiter: "; "
    authority: "both"
    description: "The language(s) of the sung or spoken words, the lyric language a DJ screens for crowd comprehension and sing-along sets. This is the content language of the words themselves, not the language tagged on the recording's metadata. Where Vocality captures the presence and type of voice, this captures what tongue that voice is in."
    rationale: "A DJ in a non-English-speaking scene (or a themed multilingual social) needs to know the lyric language for crowd comprehension and sing-along sets. Vocality already captures presence/type of voice but not the language; this fills that gap without overloading the vocality field."
    type: "enum[]"
    dj_use: "Filter by sung language for language-specific rooms or sing-along sets."
    other_tools: "De-facto standard frame TLAN (ISO 639-2) — Picard, Mp3tag, Kid3, MusicBee, beets, MediaMonkey, JRiver, foobar2000. RECOMMENDATION: align lyric_language with TLAN instead of TXXX:SDTS_LYRIC_LANGUAGE."
    examples:
      - "en"
      - "en; fr"
      - "sl"
      - "instrumental"
  - id: "recording_origin"
    display_name: "Recording Origin"
    group: "proposed-content-provenance"
    layer: "taxonomy"
    status: "proposed"
    data_type: "enum"
    cardinality: "single"
    value_source: "controlled enum (SDTS controlled vocabulary; new field — not yet in the baseline vocabulary; proposed)."
    allowed_values: "3-value enum: period-original | faithful-revival | reissue (proposed). period-original = recorded in the music's own era; faithful-revival = a modern band playing the idiom period-correctly (e.g. NOLA Jazz Revival, Modern Swing Revival); reissue = a re-release/remaster of an original-era recording. Unset = unknown."
    id3_current: "n/a (new field)"
    id3_proposed: "TXXX:SDTS_RECORDING_ORIGIN"
    vorbis: "SDTS_RECORDING_ORIGIN"
    mp4: "----:com.apple.iTunes:SDTS_RECORDING_ORIGIN"
    delimiter: "—"
    authority: "both"
    description: "Where a recording sits on the authenticity/provenance axis relative to the music's own era — an original-era cut, a modern band playing the idiom period-correctly, or a re-release of an original. Deliberately orthogonal to the three sibling axes it is easily confused with: release year (when the music was written/popularized), recording quality / quality-era (how it sounds, e.g. Acoustic vs Digital Era), and recording context (the capture setting, Studio/Live/Broadcast). A 2015 digital-era faithful revival of a 1936 Lindy tune scores on all three independently, which is why provenance needs its own field."
    rationale: "Period-correct events (e.g. Herräng) and authenticity-minded DJs want to select original-era recordings or knowingly-faithful revivals; conversely a DJ wanting clean fidelity may prefer a faithful-revival or reissue over a noisy original. None of the release year, quality-era, or recording-context can express \"is this the real thing, a revival, or a remaster\" on its own."
    type: "enum"
    dj_use: "Choose period-original vs revival/cover vs reissue — Herrang wants vintage, a modern crowd may prefer a clean revival."
    other_tools: "Partial prior art split across two ideas, neither matching: (1) reissue/remaster — Discogs Format Descriptions 'Reissue'/'Remastered', MusicBrainz release Status + originaldate vs date; (2) original-recording dating — ID3 TDOR / Picard originaldate. But NO tool distinguishes a period-original recording from a faithful modern revival of an old style — that performance-provenance axis is SDTS-specific."
    examples:
      - "period-original"
      - "faithful-revival"
      - "reissue"
  - id: "original_title"
    display_name: "Original Title"
    group: "proposed-content-provenance"
    layer: "taxonomy"
    status: "proposed"
    data_type: "string"
    cardinality: "single"
    value_source: "free text — the title of the WORK this recording is a performance of; human-set, or imported from a MediaMonkey library's Original Title column"
    allowed_values: "Free text: the original work's title as commonly known, written like a title (no '(cover)' decorations, no artist). Absent means this recording IS the original, or the work title equals TIT2 — a consumer needing a work key falls back to TIT2."
    id3_current: "n/a (new field) — MediaMonkey libraries carry this in TOAL, which ID3 defines as the original ALBUM; see the TOAL frame note"
    id3_proposed: "TXXX:SDTS_ORIGINAL_TITLE"
    vorbis: "SDTS_ORIGINAL_TITLE"
    mp4: "----:com.apple.iTunes:SDTS_ORIGINAL_TITLE"
    delimiter: "— (single value)"
    authority: "reference-impl"
    description: "The title of the WORK this recording performs, when it differs from this recording's own title (TIT2). It is the missing fourth member of the original-work cluster: TOPE carries the original performer, TOAL the original album, TDOR the original date — and until now nothing carried the original TITLE, a gap TIT2's own documentation names. Absent on an original-era recording, exactly like TOPE."
    rationale: "'Same song, different performance' is a first-class DJ axis — spotting that two records are the same work drives cover/tribute programming and avoids playing a work twice in a night. ID3 has no original-title frame, so MediaMonkey borrows TOAL for it; SDTS does NOT adopt that borrowing, because TOAL already means original ALBUM here and the two legitimately co-occur (a cover that itself appeared on an album needs both), leaving a reader unable to tell which meaning a given TOAL carries. A dedicated SDTS_ field keeps both facts expressible and keeps TOAL conformant to the ID3 spec. Chosen over a full work-identity axis (a work id plus performance→work relations, as MusicBrainz models it) because that is a much larger surface than the consumer need, and this field is forward-compatible with it: a work id can be added later without changing what this field means."
    type: "string"
    dj_use: "Group performances of one work — pull every version of 'Stormy Monday', or avoid programming the same work twice in a set."
    other_tools: "No ID3 frame exists for it. MediaMonkey stores it in the OrigSongTitle DB column and writes it to TOAL (a de-facto convention, not the ID3 meaning); Picard/Mp3tag/Kid3 expose TOAL under its spec meaning of original album. MusicBrainz models this properly as a 'work' entity that recordings link to — this field is the flat, tag-sized projection of that idea. Reading a MediaMonkey TOAL as an original title is an INGEST-PROFILE decision about a known library, never a per-file guess: SDTS cannot tell the two meanings apart from the frame alone, so the profile layer (IngestMapper) declares it once for the library."
    examples:
      - "Stormy Monday"
      - "Sing Sing Sing"
  - id: "artist_country"
    display_name: "Artist Country"
    group: "proposed-content-provenance"
    layer: "taxonomy"
    status: "proposed"
    data_type: "enum"
    cardinality: "single"
    value_source: "ISO 3166-1 country (external standard, NOT SDTS vocab) — country of the artist's/music's ORIGIN; canonical name + ISO alpha-2/alpha-3 aliases (genre model)"
    allowed_values: "Country of the artist's/music's ORIGIN, as a canonical country NAME (genre model; e.g. 'United States', 'France', 'United Kingdom'). Presentation/alias forms: the full name, the ISO 3166-1 alpha-2 ('US') and alpha-3 ('USA') codes, and a flag/locale label — all per-term metadata, rendered by the player; the codes also resolve on input. Value set = ISO 3166-1 (external standard), so NO vocabulary content is needed. Distinct from release-country (where a release was published) and recording-location. Single dominant origin (multi only for genuine multinational collaborations)."
    id3_current: "n/a (new field)"
    id3_proposed: "TXXX:SDTS_ARTIST_COUNTRY"
    vorbis: "SDTS_ARTIST_COUNTRY"
    mp4: "----:com.apple.iTunes:SDTS_ARTIST_COUNTRY"
    delimiter: "—"
    authority: "reference-impl"
    description: "The country the artist or music ORIGINATES from (France for Django Reinhardt, the United States for Count Basie), so a DJ can build country- or region-themed sets like a French Manouche night or a US-only block. This is about origin, not where a release was issued (release-country) or where the track was recorded (recording-location)."
    rationale: "A DJ sometimes wants to filter by where the music is from — a French Manouche night, a US-only block, regional theming. Genre and recording_origin cannot answer geography. Cheap and factual (ISO 3166-1), and per-track so it travels with the file (no external artist database needed)."
    type: "enum (ISO 3166-1 alpha-2)"
    dj_use: "Pull a country / region set — 'only French', 'US-only' — for geographic theming."
    other_tools: "ISO 3166-1 is the universal country standard. MusicBrainz models artist 'Area' (origin) and 'Release Country' at the DB level; ID3 has no standard artist-origin frame (do NOT conflate with the release-country TXXX conventions — a different concept). SDTS: TXXX:SDTS_ARTIST_COUNTRY, canonical country name + ISO alpha-2/alpha-3 aliases."
    examples:
      - "France"
      - "United States"
      - "United Kingdom"

# Standard music frames the reference implementation writes (SDTS does not redefine these; some are overloaded).
# These are ID3-standard pass-through frames; docs are generated into docs/standard/fields/id3/.
  - id: "regions"
    display_name: "Regions"
    group: "proposed-tempo-structure"
    layer: "derived"
    status: "proposed"
    data_type: "composite"
    cardinality: "multi"
    value_source: "human-marked typed regions (start/end ms + kind); durable in-tag, not session-scoped"
    allowed_values: "An ordered '; '-joined list of typed regions, each 'start_ms:end_ms:kind' (two integers + a kind token). kind is a closed set: silence | speech | music-boundary. No JSON (per the SDTS no-JSON-in-tags rule). Per-region source/confidence are a reserved forward-compatible extension (trailing ':'-delimited fields)."
    id3_current: "n/a (new field)"
    id3_proposed: "TXXX:SDTS_REGIONS"
    vorbis: "SDTS_REGIONS"
    mp4: "----:com.apple.iTunes:SDTS_REGIONS"
    delimiter: "; "
    description: "Manually-marked typed regions on a track — leading/trailing silence, spoken/speech passages, and music-boundary marks — persisted durably in-tag so they survive across sessions and machines. Each region is a [start_ms, end_ms) span with a kind (silence/speech/music-boundary). Distinct from playback_start/stop (single cue points) and intro/outro_duration (scalar lengths): regions is the general list of typed spans."
    rationale: "A player lets a DJ hand-mark typed regions (silence/speech/music boundaries) that must persist on-disk, not just in a session overlay. No existing SDTS field carries a list of typed spans — playback_* are single cues and intro/outro are scalars. Encoded as delimited 'start:end:kind' tuples rather than JSON, matching the standard's no-JSON-in-tags rule (cf. intro_duration)."
    type: "region-list"
    dj_use: "Trim talky intros, mark silence gaps, flag music-vs-speech boundaries — durable across machines."
    examples:
      - "0:3200:silence; 3200:8500:speech"
      - "185000:190000:music-boundary"

# Standard music-library metadata fields — the context-independent canonical FieldIds for the ubiquitous
# library fields (title/artist/album/…). NOT SDTS taxonomy fields (those are `fields:` above): each gets a
# FieldId so a consumer can key a taxonomy-agnostic field map without magic strings, but no spec section, no
# field doc, and no SDTS_ frame. Each names the standard ID3 frame it derives from where one exists; the id
# itself is frame-independent.
standard_fields:
  - id: "title"
    display_name: "Title"
    frame: "TIT2"
    description: "The recording's title — standard library metadata (ID3 TIT2)."
  - id: "artist"
    display_name: "Artist"
    frame: "TPE1"
    description: "The recording's lead performer(s) — standard library metadata (ID3 TPE1)."
  - id: "album"
    display_name: "Album"
    frame: "TALB"
    description: "The album / release grouping — standard library metadata (ID3 TALB)."
  - id: "key"
    display_name: "Key"
    frame: "TKEY"
    description: "Musical key — standard library metadata (ID3 TKEY)."
  - id: "grouping"
    display_name: "Grouping"
    frame: "TIT1"
    description: "Content grouping — standard library metadata (ID3 TIT1)."
  - id: "year"
    display_name: "Year"
    frame: "TDRC"
    description: "Release year (numeric) — standard library metadata (ID3 TDRC)."

standard_frames:
  - frame: "TIT2"
    field: "Title"
    description: "The title of THIS recording, written as-is. For a cover or medley it is this version's own title. ID3 has no original-title frame; the work this recording performs is named by the SDTS `original_title` field, alongside TOPE (original performer), TOAL (original album) and TDOR (original date)."
    when_to_use: "Always; every track has a title. Keep the artist out of it (use TPE1) and don't bake '(Live)'/'(Cover)' decorations in — those are recording_context / object-state."
    examples:
      - "Sing Sing Sing"
      - "Medley: Jumpin' at the Woodside / One O'Clock Jump"
  - frame: "TPE1"
    field: "Artist"
    description: "Lead performer(s) of THIS recording. For a cover or tribute this is the performer of this version; the ORIGINAL artist goes in TOPE."
    when_to_use: "Always. Multiple performers join with '; '. The composer is not the artist (that's TCOM)."
    examples:
      - "Benny Goodman"
      - "Ella Fitzgerald; Louis Armstrong"
  - frame: "TALB"
    field: "Album / Labels"
    description: "Album title. The reference implementation overloads it as a '; '-joined list of record labels / release groupings rather than a single album name."
    when_to_use: "Carry the label(s) / release grouping. The track's ORIGINAL album (for a reissue or cover) goes in TOAL, not here."
    examples:
      - "Decca"
      - "Columbia; OKeh"
  - frame: "COMM (no desc, any language)"
    field: "Comment"
    description: "The canonical user comment: the COMM frame with an EMPTY description, in any language (the reference implementation reads any and writes 'XXX'). It is the user's free text with no label, prefix or schema, so it stays readable in every tool that shows a comment. A COMM frame WITH a description is never the canonical comment (MediaMonkey's Songs-DB_* columns are such frames). Historically it also carried (i)/(vm)-style abbreviation tags, now migrated to structured fields."
    when_to_use: "Free-text notes only. A tool that ADDS a note appends it after '; ' and never rewrites, reorders or de-duplicates the existing text (reference implementation: AppendCanonicalComment). A reader may split on '; ' to show separate notes, but treats the text as opaque prose when writing it back, since a note may itself contain '; '. Structured data (vocality, energy, dance tags, warning severity or position) goes to its own field or a tool-private extension frame, never into the comment."
    examples:
      - "Great clarinet solo at 1:12"
      - "From the 1938 Carnegie Hall concert"
  - frame: "TIT1"
    field: "Grouping"
    description: "Reused for the legacy `workflow_tags` bag — multi-value markers across analytic / personal / recording-meta / classifier-meta / object-state."
    when_to_use: "Frozen pass-through only. NOT a portable SDTS field — being decomposed (Medley→song_form, Cover/Tribute→recording_origin, recording-meta→quality flags; Canonical/Duplicate + personal/triage markers stay non-portable), pending vocabulary-maintainer ratification."
    examples:
      - "Canonical"
      - "Cover"
      - "Medley"
  - frame: "TOPE"
    field: "Original Artist"
    description: "The ORIGINAL performer(s) of the work, used when this recording is a cover or a tribute. Pairs with the Cover/Tribute object-state: TPE1 = this version's performer, TOPE = who originally did it."
    when_to_use: "Fill on a Cover (a distinct interpretation) or a Tribute (an imitation aiming to sound like the original). Leave EMPTY on an original-era recording — don't mirror TPE1. It is the original PERFORMER, not the composer (TCOM)."
    examples:
      - "Louis Prima"
      - "Benny Goodman Orchestra"
  - frame: "TOAL"
    field: "Original Album"
    description: "The album / show / film the work ORIGINALLY appeared on, when this release differs (reissue, compilation, cover)."
    when_to_use: "Optional. Set when the original release differs from this one's TALB — e.g. a 2015 compilation track originally issued on a 1938 single. NOTE: MediaMonkey borrows this frame for the original TITLE (its OrigSongTitle column), which is NOT the ID3 meaning and NOT how SDTS reads it — the original title has its own field (`original_title`). SDTS cannot tell the two meanings apart from the frame alone, so treating a library's TOAL as an original title is an INGEST-PROFILE declaration about that known library, never a per-file inference."
    examples:
      - "The Famous 1938 Carnegie Hall Jazz Concert"
  - frame: "TDOR"
    field: "Original Release Date"
    description: "The ORIGINAL release date of the work (ID3v2.4; v2.3 used TORY, year-only). Distinct from TDRC, which is THIS release's date."
    when_to_use: "Set on reissues / remasters / covers so the original date survives. Feeds the 'is this period-original?' judgement (see recording_origin). A full date or a bare year both work."
    examples:
      - "1938"
      - "1938-08-16"
  - frame: "TIPL"
    field: "Involved People List"
    description: "Production / technical credits as a flat list of (function, person) pairs — producer, engineer, arranger, and the like. A PAIRED-list frame (ID3v2.4): each entry is a role token followed by the person who filled it, not a single text value. The container surfaces it as raw (role, name) pairs and imposes no role vocabulary — typed resolution is a semantic-layer concern. SDTS defines an OPEN baseline `credit_role` vocabulary for that resolution: a known role gains a code + description, an unknown role passes through carrying its raw string."
    when_to_use: "Record who did WHAT behind the recording (producer, engineer, arranger). Performers on an instrument belong in TMCL, not here. Leave empty when no production credits are known — do NOT mirror the artist (TPE1)."
    examples:
      - "producer / John Hammond"
      - "arranger / Fletcher Henderson"
  - frame: "TMCL"
    field: "Musician Credits List"
    description: "Performer credits as a flat list of (instrument, person) pairs — who played what. A PAIRED-list frame (ID3v2.4), sibling to TIPL: each entry is an instrument token followed by the performer. The container surfaces it as raw (instrument, name) pairs and constrains nothing; the instrument column MAY be resolved (OPEN) against the SDTS instrument vocabulary (the `instrument` dimension — the same one the instrument_led lead field draws its lead subset from; a known instrument gains a code + description + the specific→family hierarchy, an unknown passes through raw). Credit-only instruments carry lead_capable=false, so they resolve here without polluting the lead field's subset."
    when_to_use: "Record each performer and the instrument they played. Non-performing production roles (producer, engineer) belong in TIPL. Leave empty when the line-up is unknown."
    examples:
      - "Piano / Count Basie"
      - "Clarinet / Benny Goodman"

# Reference-implementation–private / derived frames: the reference implementation's private cache frames, NOT portable SDTS (frozen SB- prefix)
reference_impl_private:
  - frame: "TXXX:SB-Beats"
    purpose: "Beat positions (ms array) — the beat grid."
  - frame: "TXXX:SB-Beatinfos"
    purpose: "Per-beat annotations (BeatInfoDto; tuple-row JSON)."
  - frame: "TXXX:SB-BeatLocks"
    purpose: "Beat indices the user manually verified (anchors for shift / redistribute)."
  - frame: "TXXX:SB-Downbeats"
    purpose: "Downbeat positions (ms array)."
  - frame: "TXXX:SB-SongForm"
    purpose: "Structural form (AABA / 12-bar Blues / bar count) — this is the storage for the portable song_form field."
  - frame: "TXXX:SB-Verified"
    purpose: "Per-category verification booleans (JSON object)."
  - frame: "TXXX:SB-Stems"
    purpose: "Demucs per-section / per-bar RMS profile + fingerprint (tuple-row JSON v1)."
  - frame: "TXXX:SB-WordByWordLyrics"
    purpose: "Whisper word-by-word timings + language + segment boundaries (JSON v1)."
  - frame: "TXXX:SB-Quality"
    purpose: "Audio-quality analysis JSON (score / cutoff / DR14 / source). Distinct from the recording_quality_era enum."
  - frame: "TXXX:SB-Migrations"
    purpose: "Applied one-shot migration tokens ('; '-joined) so a track is not re-migrated each load."
  - frame: "TXXX:SB-DanceSteps"
    purpose: "Choreography step list (tuple-row JSON v1). Candidate to graduate into a portable SDTS field."
  - frame: "TXXX:SB-Choreography"
    purpose: "Track-level choreography metadata: name / era / formation (JSON). Candidate to graduate."
  - frame: "TXXX:SB-EssentiaResult"
    purpose: "Cached Essentia high-level analysis (genres / moods / danceability / tempo / instruments) + schema version."
  - frame: "TXXX:SB-Chroma"
    purpose: "Cached per-beat 12-bin chroma vectors, pinned to the beat-grid fingerprint."
  - frame: "TXXX:SB-Warnings"
    purpose: "User-flagged unusual moments (odd ending / break / genre shift; tuple-row JSON). Candidate to graduate."
  - frame: "TXXX:SB-Chromaprint"
    purpose: "fpcalc acoustic fingerprint (base64url) for duplicate detection / AcoustID."
  - frame: "TXXX:SB-ChromaprintDuration"
    purpose: "fpcalc-measured duration (s, float), paired with the fingerprint for AcoustID."
  - frame: "TXXX:SB-Instruments"
    purpose: "Hand-set instrument overrides (JSON object)."
  - frame: "PRIV:Moodbar Cache"
    purpose: "Binary moodbar (PNG / WAV) cache."
  - frame: "TXXX:SB-BaseStructureSize, TXXX:SB-BarSize"
    purpose: "Legacy — superseded by SB-SongForm; kept read-only for migration."
