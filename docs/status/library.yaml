  kind: requirement
  title: Vorbis and MP4 bindings (`.Vorbis` / `.Mp4` packages) via the cross-format triangle
  status: gap
  release: post-v1.0
  evidence: >-
    README.md §"Non-goals & roadmap" ("`.Vorbis` / `.Mp4` bindings via the cross-format triangle").
    dotnet/src holds SocialDanceTaggingStandard, SocialDanceTaggingStandard.Id3, SocialDanceTaggingStandard.MediaMonkey and SocialDanceTaggingStandard.Taxonomy only; no Vorbis or MP4 project exists.
