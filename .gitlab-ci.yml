# GitLab mirror of .github/workflows/ci.yml (Linux only: GitLab has no hosted Windows runner here).
# Needs a runner with the Docker executor. Keep the steps in lock-step with the GitHub workflow.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages: [check, build, publish]

default:
  interruptible: true

data:
  stage: check
  image: python:3.12
  script:
    - |
      if git grep -nI -F -e 'M:\media' -e 'Songoulash' -- . ':!.github/workflows/ci.yml' ':!.gitlab-ci.yml' ; then
        echo "a private reference is present in a tracked file"
        exit 1
      fi
    - |
      if git grep -nI -E 'TagLib' -- 'dotnet/samples/SocialDanceTaggingStandard.ConsumerProbe/*.cs' ; then
        echo "the consumer probe names a TagLib type - the SdtsFile gateway is leaking"
        exit 1
      fi
    - python -m pip install --upgrade pyyaml jsonschema
    - python scripts/validate_data.py
    - python scripts/gen_field_docs.py
    - python scripts/gen_vocab_docs.py
    - python scripts/gen_conformance_vectors.py
    - python scripts/gen_ids.py
    - python scripts/gen_overlay_schema.py
    - >
      git diff --exit-code docs/standard/fields docs/model/vocabulary conformance/vectors/validation schemas
      dotnet/src/SocialDanceTaggingStandard/Generated
      dotnet/src/SocialDanceTaggingStandard.Id3/Generated
      dotnet/src/SocialDanceTaggingStandard.MediaMonkey/Generated
      dotnet/src/SocialDanceTaggingStandard.Taxonomy/Generated

dotnet:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  variables:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget
  cache:
    key: nuget
    paths: [.nuget/]
  before_script:
    # The test projects target net8.0 but the SDK image ships only the 10.0 runtime; install the 8.0 runtime beside it.
    - curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
    - bash /tmp/dotnet-install.sh --runtime dotnet --channel 8.0 --install-dir /usr/share/dotnet
  script:
    - dotnet build dotnet/SocialDanceTaggingStandard.slnx -c Release
    - dotnet format dotnet/SocialDanceTaggingStandard.slnx --verify-no-changes --no-restore
    - dotnet test dotnet/SocialDanceTaggingStandard.slnx -c Release --no-build

docs:
  stage: build
  image: python:3.12
  script:
    - python -m pip install -r requirements-docs.txt
    - python -m mkdocs build --strict --site-dir public
  artifacts:
    paths: [public]
    expire_in: 1 week

# Private preview of the docs site on GitLab Pages (default branch only).
pages:
  stage: publish
  image: alpine:3
  needs: [docs]
  script:
    - test -f public/index.html
  pages: true
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
